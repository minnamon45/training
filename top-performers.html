        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';

            document.body.appendChild(toast);

        // ========== عرض حالة الكاش ==========

            const cacheInfo = document.getElementById('cacheInfo');
            if (!cacheInfo) return;
            
            if (window.CacheManager) {
                const cached = CacheManager.get(CACHE_KEYS.EMPLOYEES);

                    } else {
                        //cacheInfo.innerHTML = '📦 البيانات من الكاش &nbsp;|&nbsp; <a href="#" onclick="refreshAllData(); return false;" style="color:#4299e1;">🔄 تحديث يدوي</a>';

        // ========== تحديث جميع البيانات يدوياً ==========
        async function refreshAllData() {
            showToast("🔄 جاري تحديث البيانات...");
            if (window.CacheManager) {
                for (const key in CACHE_KEYS) {
                    CacheManager.remove(CACHE_KEYS[key]);
                    localStorage.removeItem(CACHE_KEYS[key] + '_time');

            }

        function isExcludedCourse(courseName) {
            if (!courseName) return false;
            const courseNameLower = courseName.toLowerCase();
            return EXCLUDED_COURSES.some(excluded => courseNameLower.includes(excluded.toLowerCase()));
        }

        // ========== دوال تحويل التاريخ ==========
        function formatDate(dateValue) {
            if (!dateValue) return null;
            if (typeof dateValue === 'number') {
                var utcDays = dateValue - 25569;
                var date = new Date(utcDays * 86400000);
                var year = date.getFullYear();
                var month = String(date.getMonth() + 1).padStart(2, '0');
                var day = String(date.getDate()).padStart(2, '0');
                return year + '-' + month + '-' + day;
            }
            return dateValue;
        }

        function getDateObject(dateValue) {
            if (!dateValue) return null;
            if (typeof dateValue === 'number') {
                var utcDays = dateValue - 25569;
                return new Date(utcDays * 86400000);
            }
            return new Date(dateValue);
        }

        // ========== دالة حساب ساعات الجلسة ==========
        function getSessionHours(session, course) {
            if (course && course.duration_hours && course.duration_hours > 0) {
                return parseFloat(course.duration_hours);
            }
            
            if (session.start_time && session.end_time) {
                let startTime = session.start_time.toString();
                let endTime = session.end_time.toString();
                
                if (typeof session.start_time === 'number') {
                    let totalSeconds = Math.round(session.start_time * 86400);
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    startTime = hours.toString().padStart(2, '0') + ':' + minutes.toString().padStart(2, '0');
                }
                if (typeof session.end_time === 'number') {
                    let totalSeconds = Math.round(session.end_time * 86400);
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    endTime = hours.toString().padStart(2, '0') + ':' + minutes.toString().padStart(2, '0');
                }
                
                const startParts = startTime.split(':');
                const endParts = endTime.split(':');
                let startHour = parseInt(startParts[0]) || 0;
                let startMinute = parseInt(startParts[1]) || 0;
                let endHour = parseInt(endParts[0]) || 0;
                let endMinute = parseInt(endParts[1]) || 0;
                
                let diffHours = endHour - startHour;
                let diffMinutes = endMinute - startMinute;
                
                if (diffHours < 0) diffHours = 24 + diffHours;
                let hours = diffHours + (diffMinutes / 60);
                return parseFloat(hours.toFixed(2));
            }
            
            return 0;
        }

        // ========== تحميل البيانات من Firebase مع الكاش ==========
        async function loadEmployeesData(forceRefresh = false) {
            try {
                if (!forceRefresh && window.CacheManager) {
                    const cached = CacheManager.get(CACHE_KEYS.EMPLOYEES);
                    if (cached) {
                        console.log("📦 استخدام الكاش للموظفين");
                        employees = cached;
                        employeeDeptMap.clear();
                        employees.forEach(emp => {
                            if (emp.id && emp.department && emp.status !== 'Left') {
                                employeeDeptMap.set(emp.id.toString(), emp.department);
                            }
                        });
                        return employees;
                    }
                }
                
                console.log("☁️ جلب الموظفين من Firebase");
                const snapshot = await db.collection('employees').get();
                employees = [];
                employeeDeptMap.clear();
                
                snapshot.forEach(doc => {
                    const emp = { id: doc.id, ...doc.data() };
                    employees.push(emp);
                    
                    if (emp.id && emp.department && emp.status !== 'Left') {
                        employeeDeptMap.set(emp.id.toString(), emp.department);
                    }
                });
                
                if (window.CacheManager) {
                    CacheManager.set(CACHE_KEYS.EMPLOYEES, employees);
                    localStorage.setItem(CACHE_KEYS.EMPLOYEES + '_time', Date.now().toString());
                }
                
                console.log('✅ تم تحميل ' + employees.length + ' موظف');
                return employees;
            } catch (error) {
                console.error("❌ خطأ في تحميل الموظفين:", error);
                employees = [];
                return [];
            }
        }

                    CacheManager.set(CACHE_KEYS.ONJOB_SESSIONS, onJobSessions);
                    CacheManager.set(CACHE_KEYS.ONJOB_ENROLLMENTS, onJobEnrollments);

            } catch (error) {
                console.error("❌ خطأ في تحميل On Job:", error);
            }
        }

        // ========== تصفية حسب الشهر ==========
        function filterSessionsByMonth(sessions) {
            if (currentMonth === -1) return sessions;
            return sessions.filter(session => {
                if (!session.session_date) return false;
                let dateObj = getDateObject(session.session_date);
                return dateObj && dateObj.getMonth() === currentMonth;
            });
        }

        function calculateSessionHoursFromTime(startTime, endTime) {
            if (!startTime || !endTime) return 0;
            const startParts = startTime.toString().split(':');
            const endParts = endTime.toString().split(':');
            const startHour = parseInt(startParts[0]) || 0;
            const startMin = parseInt(startParts[1]) || 0;
            const endHour = parseInt(endParts[0]) || 0;
            const endMin = parseInt(endParts[1]) || 0;
            let hours = (endHour - startHour) + (endMin - startMin) / 60;
            if (hours < 0) hours = 24 + hours;
            return hours;
        }

        function getActiveData() {
            let courses = [];
            let sessions = [];
            let enrollments = [];
            
            if (currentType === 'offjob') {
                courses = [...offJobCourses];
                sessions = [...offJobSessions];
                enrollments = [...offJobEnrollments];
            } else if (currentType === 'onjob') {
                courses = [...onJobCourses];
                sessions = [...onJobSessions];
                enrollments = [...onJobEnrollments];
            } else {
                const allCourses = [...offJobCourses, ...onJobCourses];
                const allSessions = [...offJobSessions, ...onJobSessions];
                const uniqueCourses = new Map();
                allCourses.forEach(c => { if (c.course_code) uniqueCourses.set(c.course_code.toString(), c); });
                courses = Array.from(uniqueCourses.values());
                
                const uniqueSessions = new Map();
                allSessions.forEach(s => { if (s.session_code) uniqueSessions.set(s.session_code.toString(), s); });
                sessions = Array.from(uniqueSessions.values());
                
                enrollments = [...offJobEnrollments, ...onJobEnrollments];
            }
            
            const excludedCourseCodes = new Set();
            courses.forEach(course => {
                if (isExcludedCourse(course.course_name)) {
                    excludedCourseCodes.add(course.course_code?.toString());
                }
            });
            
            const filteredSessions = sessions.filter(session => 
                !excludedCourseCodes.has(session.course_code?.toString())
            );
            
            return { courses, sessions: filteredSessions, enrollments };
        }

        function excludeSpecialEmployees(employeeIds) {
            const excludedLevels = ['HODs', 'GM', 'Director'];
            const excludedPositions = ['General Manager', 'Hotel Manager', 'Department Head'];
            
            return employeeIds.filter(id => {
                const emp = employees.find(e => e.id == id);
                if (!emp) return true;
                if (excludedLevels.includes(emp.level)) return false;
                if (excludedPositions.some(p => emp.position?.includes(p))) return false;
                return true;
            });
        }

        // ========== حساب إحصائيات الأقسام ==========
        function calculateDepartmentStats() {
            const { sessions: filteredSessions, courses, enrollments: allEnrollments } = getActiveData();
            
            const filteredSessionsList = filterSessionsByMonth(filteredSessions);
            const deptStats = new Map();
            
            const coursesMap = new Map();
            courses.forEach(c => { if (c.course_code) coursesMap.set(c.course_code.toString(), c); });
            
            console.log('📊 عدد الجلسات للتحليل: ' + filteredSessionsList.length);
            
            filteredSessionsList.forEach(session => {
                const sessionCode = session.session_code;
                const attendees = allEnrollments.filter(e => e.session_code == sessionCode && e.enrollment_status === 'Completed');
                const course = coursesMap.get(session.course_code);
                
                let sessionHours = getSessionHours(session, course);
                
                attendees.forEach(attendee => {
                    const empId = attendee.employee_id?.toString();
                    let dept = employeeDeptMap.get(empId);
                    
                    if (!dept) {
                        const employee = employees.find(e => e.id == empId);
                        if (employee && employee.department) {
                            dept = employee.department;
                            employeeDeptMap.set(empId, dept);
                        }
                    }
                    
                    if (!dept) {
                        dept = 'قسم غير محدد';
                    }
                    
                    if (!deptStats.has(dept)) {
                        deptStats.set(dept, { 
                            sessions: new Set(), 
                            uniqueEmployees: new Set(), 
                            hours: 0
                        });
                    }
                    const stats = deptStats.get(dept);
                    if (empId) stats.uniqueEmployees.add(empId);
                    stats.hours += sessionHours;
                    if (!stats.sessions.has(sessionCode)) {
                        stats.sessions.add(sessionCode);
                    }
                });
            });
            
            const result = Array.from(deptStats.keys()).map(dept => ({
                department: dept,
                sessions: deptStats.get(dept).sessions.size,
                uniqueEmployees: deptStats.get(dept).uniqueEmployees.size,
                hours: parseFloat(deptStats.get(dept).hours.toFixed(1))
            }));
            
            return result.sort((a, b) => b.uniqueEmployees - a.uniqueEmployees);
        }

        // ========== حساب إحصائيات الشهور ==========
        function calculateMonthlyStats() {
            const { courses, sessions, enrollments: allEnrollments } = getActiveData();
            
            const monthlyStats = new Map();
            for (let i = 0; i < 12; i++) {
                monthlyStats.set(i, { uniqueEmployees: new Set(), sessions: 0, hours: 0 });
            }
            
            const coursesMap = new Map();
            courses.forEach(c => { if (c.course_code) coursesMap.set(c.course_code.toString(), c); });
            
            const sessionsByMonth = new Map();
            for (let i = 0; i < 12; i++) sessionsByMonth.set(i, []);
            
            sessions.forEach(session => {
                if (!session.session_date) return;
                let dateObj = getDateObject(session.session_date);
                if (dateObj) {
                    const month = dateObj.getMonth();
                    sessionsByMonth.get(month).push(session);
                }
            });
            
            const enrollmentsBySession = new Map();
            allEnrollments.forEach(e => {
                if (e.enrollment_status === 'Completed') {
                    const key = e.session_code?.toString();
                    if (!enrollmentsBySession.has(key)) enrollmentsBySession.set(key, []);
                    enrollmentsBySession.get(key).push(e.employee_id?.toString());
                }
            });
            
            for (let month = 0; month < 12; month++) {
                const monthSessions = sessionsByMonth.get(month);
                const stats = monthlyStats.get(month);
                stats.sessions = monthSessions.length;
                
                const uniqueEmpSet = new Set();
                let totalHours = 0;
                
                monthSessions.forEach(session => {
                    const sessionCode = session.session_code?.toString();
                    const attendees = enrollmentsBySession.get(sessionCode) || [];
                    attendees.forEach(empId => uniqueEmpSet.add(empId));
                    
                    const course = coursesMap.get(session.course_code?.toString());
                    let hoursPerAttendee = course?.duration_hours || 0;
                    if (hoursPerAttendee === 0 && session.start_time && session.end_time) {
                        hoursPerAttendee = calculateSessionHoursFromTime(session.start_time, session.end_time);
                    }
                    totalHours += hoursPerAttendee * attendees.length;
                });
                
                stats.uniqueEmployees = uniqueEmpSet.size;
                stats.hours = parseFloat(totalHours.toFixed(1));
            }
            
            const result = [];
            for (let i = 0; i < 12; i++) {
                const stats = monthlyStats.get(i);
                result.push({
                    month: i,
                    monthName: monthNames[i],
                    uniqueEmployees: stats.uniqueEmployees,
                    sessions: stats.sessions,
                    hours: stats.hours
                });
            }
            return result;
        }

        // ========== حساب أفضل الموظفين ==========
        function calculateTopEmployees() {
            const { sessions: allSessions, courses, enrollments: allEnrollments } = getActiveData();
            
            const filteredSessions = filterSessionsByMonth(allSessions);
            
            const excludedCourseNames = ['تعريف الموظفين الجدد', 'الهاسب', 'New Hire Induction', 'HACCP'];
            const excludedCourseCodes = new Set();
            
            courses.forEach(course => {
                const courseName = course.course_name?.toLowerCase() || '';
                const isExcluded = excludedCourseNames.some(excluded => 
                    courseName.includes(excluded.toLowerCase())
                );
                if (isExcluded && course.course_code) {
                    excludedCourseCodes.add(course.course_code.toString());
                }
            });
            
            const filteredSessionsWithoutExcluded = filteredSessions.filter(session => 
                !excludedCourseCodes.has(session.course_code?.toString())
            );
            
            const coursesMap = new Map();
            courses.forEach(c => { if (c.course_code) coursesMap.set(c.course_code.toString(), c); });
            
            const sessionsMap = new Map();
            filteredSessionsWithoutExcluded.forEach(s => { if (s.session_code) sessionsMap.set(s.session_code.toString(), s); });
            
            const employeeStats = new Map();
            
            filteredSessionsWithoutExcluded.forEach(session => {
                const sessionCode = session.session_code;
                const attendees = allEnrollments.filter(e => e.session_code == sessionCode && e.enrollment_status === 'Completed');
                const course = coursesMap.get(session.course_code);
                
                let sessionHours = getSessionHours(session, course);
                
                attendees.forEach(attendee => {
                    const empId = attendee.employee_id?.toString();
                    if (!empId) return;
                    
                    if (!employeeStats.has(empId)) {
                        employeeStats.set(empId, { sessions: 0, hours: 0 });
                    }
                    const stats = employeeStats.get(empId);
                    stats.sessions++;
                    stats.hours += sessionHours;
                });
            });
            
            let employeeArray = Array.from(employeeStats.keys()).map(empId => {
                const emp = employees.find(e => e.id == empId);
                return {
                    id: empId,
                    name: emp && emp.fullName ? emp.fullName : 'غير معروف',
                    department: employeeDeptMap.get(empId) || (emp && emp.department ? emp.department : '-'),
                    position: emp && emp.position ? emp.position : '-',
                    level: emp && emp.level ? emp.level : '-',
                    sessions: employeeStats.get(empId).sessions,
                    hours: parseFloat(employeeStats.get(empId).hours.toFixed(1))
                };
            });
            
            let filteredIds = excludeSpecialEmployees(employeeArray.map(e => e.id));
            employeeArray = employeeArray.filter(e => filteredIds.includes(e.id));
            
            const topByHours = [...employeeArray].sort((a, b) => b.hours - a.hours).slice(0, 3);
            const topBySessions = [...employeeArray].sort((a, b) => b.sessions - a.sessions).slice(0, 3);
            
            console.log("🏆 أفضل الموظفين حسب الساعات:", topByHours);
            console.log("🏆 أفضل الموظفين حسب الجلسات:", topBySessions);
            
            return { topBySessions, topByHours };
        }

                        <div class="chart-card"><h3>👥 عدد المتدربين حسب الشهر</h3><div class="chart-wrapper"><canvas id="monthlyEmployeesChart"></canvas></div></div>
                        <div class="chart-card"><h3>🎯 عدد الجلسات حسب الشهر</h3><div class="chart-wrapper"><canvas id="monthlySessionsChart"></canvas></div></div>
                        <div class="chart-card"><h3>⏰ عدد الساعات حسب الشهر</h3><div class="chart-wrapper"><canvas id="monthlyHoursChart"></canvas></div></div>
                    </div>
                </div>

                <div class="footer">
                    <p>© 2025 نظام إدارة التعليم والتطوير - جميع الحقوق محفوظة</p>
                </div>
            `;
            
            updateCacheInfo();
            
            setTimeout(() => {
                initDeptCharts(deptStats);
                initMonthlyCharts(monthlyStats);
            }, 100);
        }

        // ========== بدء التشغيل ==========
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                console.log("✅ مستخدم مسجل دخول:", user.email);
                await loadPage(false);
                window.changeMonth = changeMonth;
                window.changeType = changeType;
                window.logout = logout;
                window.refreshAllData = refreshAllData;
            } else {
                const loggedUser = JSON.parse(sessionStorage.getItem('loggedUser'));
                if (loggedUser) {
                    await loadPage(false);
                } else {
                    window.location.href = 'login.html';
                }
            }
        });
    </script>
</body>

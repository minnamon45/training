        let courses = [];

        const monthNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

        const CACHE_KEYS = {
            EMPLOYEES: 'reports_employees_v1',
            COURSES: 'reports_courses_v1',

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            if (isError) toast.classList.add('error');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function updateCacheInfo() {
            const cacheInfo = document.getElementById('cacheInfo');
            if (!cacheInfo) return;
            
            if (window.CacheManager) {
                const cachedEmployees = CacheManager.get(CACHE_KEYS.EMPLOYEES);
                const cachedCourses = CacheManager.get(CACHE_KEYS.COURSES);
                const cachedSessions = CacheManager.get(CACHE_KEYS.SESSIONS);
                const cachedEnrollments = CacheManager.get(CACHE_KEYS.ENROLLMENTS);
                
                if (cachedEmployees && cachedCourses && cachedSessions && cachedEnrollments) {
                    const cacheTime = localStorage.getItem(CACHE_KEYS.EMPLOYEES + '_time');
                    if (cacheTime) {
                        const date = new Date(parseInt(cacheTime));
                        cacheInfo.innerHTML = `📦 البيانات من الكاش - آخر تحديث: ${date.toLocaleString('ar-EG')} &nbsp;|&nbsp; <a href="#" onclick="refreshAllData(); return false;" style="color:#4299e1;">🔄 تحديث يدوي</a>`;
                    }
                } else {
                    cacheInfo.innerHTML = `☁️ البيانات من Firebase (تم التحديث الآن)`;
                }
            }
        }

        async function refreshAllData() {
            showToast("🔄 جاري تحديث البيانات...");
            if (window.CacheManager) {
                for (const key in CACHE_KEYS) {
                    CacheManager.remove(CACHE_KEYS[key]);
                    localStorage.removeItem(CACHE_KEYS[key] + '_time');
                }
            }
            await loadPage(true);
            showToast("✅ تم تحديث البيانات بنجاح");
        }

        function formatDate(dateValue) {
            if (!dateValue) return '-';
            
            if (typeof dateValue === 'number') {
                var utcDays = dateValue - 25569;
                var date = new Date(utcDays * 86400000);
                var year = date.getFullYear();
                var month = String(date.getMonth() + 1).padStart(2, '0');
                var day = String(date.getDate()).padStart(2, '0');
                return year + '-' + month + '-' + day;
            }
            
            var dateStr = dateValue.toString();
            if (dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) return dateStr;
            return dateStr.split('T')[0];
        }

        async function loadEmployeesData(forceRefresh = false) {
            try {
                if (!forceRefresh && window.CacheManager) {
                    const cached = CacheManager.get(CACHE_KEYS.EMPLOYEES);
                    if (cached) {
                        console.log("📦 استخدام الكاش للموظفين");
                        employees = cached;
                        employeeMap.clear();
                        employees.forEach(emp => {
                            if (emp.id) employeeMap.set(emp.id.toString(), emp);
                        });
                        return employees;
                    }
                }
                
                console.log("☁️ جلب الموظفين من Firebase");
                const snapshot = await db.collection('employees').get();
                employees = [];
                employeeMap.clear();
                
                snapshot.forEach(doc => {
                    const emp = { id: doc.id, ...doc.data() };
                    employees.push(emp);
                    if (emp.id) {
                        employeeMap.set(emp.id.toString(), emp);
                    }
                });
                
                if (window.CacheManager) {
                    CacheManager.set(CACHE_KEYS.EMPLOYEES, employees);
                    localStorage.setItem(CACHE_KEYS.EMPLOYEES + '_time', Date.now().toString());
                }
                
                console.log(`✅ تم تحميل ${employees.length} موظف`);
                return employees;
            } catch (error) {
                console.error("❌ خطأ في تحميل الموظفين:", error);
                employees = [];
                return [];
            }
        }

        async function loadCourses(forceRefresh = false) {

        async function loadEnrollments(forceRefresh = false) {
            try {
                if (!forceRefresh && window.CacheManager) {

        function loadCoursesSelect() {
            const select = document.getElementById('courseSelect');
            if (!select) return;
            
            if (courses.length === 0) {
                select.innerHTML = '<option value="">-- لا توجد كورسات --</option>';
                return;
            }
            
            select.innerHTML = '<option value="">-- اختر التدريب --</option>';
            courses.forEach(course => {

        function filterSessionsByDate(sessionsList, dateType, fromDate, toDate, selectedMonth, selectedYear) {
            if (!sessionsList || sessionsList.length === 0) return [];
            
            return sessionsList.filter(session => {
                if (!session.session_date) return false;
                
                let dateObj;
                if (typeof session.session_date === 'number') {
                    var utcDays = session.session_date - 25569;
                    dateObj = new Date(utcDays * 86400000);
                } else {
                    dateObj = new Date(session.session_date);
                }
                
                if (isNaN(dateObj.getTime())) return false;
                
                if (dateType === 'month' && selectedMonth !== '-1') {
                    return dateObj.getMonth() === parseInt(selectedMonth);
                }
                else if (dateType === 'year' && selectedYear !== '-1') {
                    return dateObj.getFullYear() === parseInt(selectedYear);
                }
                else if (dateType === 'range' && fromDate && toDate) {
                    const from = new Date(fromDate);
                    const to = new Date(toDate);
                    return dateObj >= from && dateObj <= to;
                }
                return true;
            });
        }

        function calculateDepartmentStats(attendeesList) {
            const deptMap = new Map();
            
            // تهيئة جميع الأقسام بقيمة 0
            ALL_DEPARTMENTS.forEach(dept => {
                deptMap.set(dept, 0);
            });
            
            // حساب الحضور الفعلي لكل قسم
            attendeesList.forEach(attendee => {
                let dept = attendee.department || 'غير محدد';
                // التحقق إذا كان القسم موجود في القائمة الأساسية
                if (ALL_DEPARTMENTS.includes(dept)) {
                    deptMap.set(dept, (deptMap.get(dept) || 0) + 1);
                } else if (dept !== '-') {
                    // إذا كان قسم غير موجود في القائمة، نضيفه كقسم آخر
                    const otherKey = 'أخرى';
                    if (!deptMap.has(otherKey)) deptMap.set(otherKey, 0);
                    deptMap.set(otherKey, (deptMap.get(otherKey) || 0) + 1);
                }
            });
            
            const stats = Array.from(deptMap.entries()).map(([department, count]) => ({
                department,
                count
            })).sort((a, b) => b.count - a.count);
            
            return stats;
        }

        function updateChartDeptOptions(attendeesList) {
            const container = document.getElementById('chartDeptsContainer');
            if (!container) return;
            
            // استخدام جميع الأقسام الثابتة
            const allDepts = [...ALL_DEPARTMENTS];
            
            container.innerHTML = allDepts.map(dept => `
                <div class="dept-option">
                    <input type="checkbox" value="${dept.replace(/"/g, '&quot;')}" id="chartDept_${dept.replace(/\s/g, '_')}" checked>
                    <label for="chartDept_${dept.replace(/\s/g, '_')}">${dept}</label>
                </div>
            `).join('');
            
            // إضافة خيار تحديد الكل
            const selectAllDiv = document.createElement('div');
            selectAllDiv.className = 'dept-option';
            selectAllDiv.style.borderTop = '1px solid #e2e8f0';
            selectAllDiv.style.marginTop = '0.5rem';
            selectAllDiv.style.paddingTop = '0.5rem';
            selectAllDiv.innerHTML = `
                <input type="checkbox" id="selectAllChartDepts" checked>
                <label for="selectAllChartDepts" style="font-weight: bold;">✅ تحديد الكل</label>
            `;
            container.appendChild(selectAllDiv);
            
            const selectAllCheckbox = document.getElementById('selectAllChartDepts');
            selectAllCheckbox.addEventListener('change', (e) => {
                const allCheckboxes = container.querySelectorAll('input[type="checkbox"][value]');
                allCheckboxes.forEach(cb => {
                    cb.checked = e.target.checked;
                });
            });
        }

        // ========== عرض الرسم البياني مع الأرقام فوق الأعمدة ==========
        function renderDepartmentChart(attendeesList) {
            if (!attendeesList || attendeesList.length === 0) {
                const chartCard = document.getElementById('chartCard');
                if (chartCard) chartCard.style.display = 'none';
                return;
            }
            
            const chartCard = document.getElementById('chartCard');
            chartCard.style.display = 'block';
            
            const selectedDepts = [];
            const checkboxes = document.querySelectorAll('#chartDeptsContainer input[type="checkbox"][value]');
            checkboxes.forEach(cb => {
                if (cb.checked) selectedDepts.push(cb.value);
            });
            
            const allStats = calculateDepartmentStats(attendeesList);
            
            let filteredStats = allStats.filter(stat => selectedDepts.includes(stat.department));
            filteredStats.sort((a, b) => b.count - a.count);
            
            const departments = filteredStats.map(d => d.department);
            const counts = filteredStats.map(d => d.count);
            
            const ctx = document.getElementById('departmentChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            const colors = ['#2b7a4b', '#1e3a5f', '#e53e3e', '#ed8936', '#ecc94b', '#38a169', '#4299e1', '#9f7aea', '#ed64a6', '#a0aec0', '#4a5568', '#dd6b20', '#319795', '#6b46c1', '#d53f8c', '#718096', '#c05621'];

                            top: 30

                    afterDatasetsDraw: function(chart) {
                        const ctx = chart.ctx;
                        chart.data.datasets.forEach((dataset, datasetIndex) => {
                            const meta = chart.getDatasetMeta(datasetIndex);
                            if (!meta.hidden) {
                                meta.data.forEach((element, index) => {
                                    const value = dataset.data[index];
                                    if (value > 0) {
                                        ctx.save();
                                        ctx.font = 'bold 14px Tajawal';
                                        ctx.fillStyle = '#1e3a5f';
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'bottom';
                                        const x = element.x;
                                        const y = element.y - 8;
                                        ctx.fillText(value, x, y);
                                        ctx.restore();
                                    }
                                });
                            }
                        });

        async function findAttendees() {
            const courseCode = document.getElementById('courseSelect').value;
            const dateType = document.getElementById('dateType').value;
            const selectedMonth = document.getElementById('monthSelect')?.value || '-1';
            const selectedYear = document.getElementById('yearSelect')?.value || '-1';
            const fromDate = document.getElementById('fromDate')?.value || '';
            const toDate = document.getElementById('toDate')?.value || '';

            if (!courseCode) {
                alert('❌ الرجاء اختيار التدريب');
                return;
            }
            
            if (sessions.length === 0) {
                alert('❌ لا توجد بيانات تدريب');
                return;
            }

            let courseSessions = sessions.filter(s => s.course_code == courseCode);
            
            if (courseSessions.length === 0) {
                displayResults([], null, 0, 0, 'لا توجد جلسات لهذا التدريب في قاعدة البيانات');
                return;
            }
            
            let filteredSessions = filterSessionsByDate(courseSessions, dateType, fromDate, toDate, selectedMonth, selectedYear);
            
            if (filteredSessions.length === 0) {
                displayResults([], null, 0, 0, 'لا توجد جلسات لهذا التدريب في الفترة المحددة');
                return;
            }

            const sessionCodes = filteredSessions.map(s => s.session_code);
            
            const attendees = enrollments.filter(e => 
                sessionCodes.includes(e.session_code) && e.enrollment_status === 'Completed'
            );

            const attendeesList = [];
            const processedEmployees = new Set();

            attendees.forEach(attendee => {
                const empId = attendee.employee_id?.toString();
                if (processedEmployees.has(empId)) return;
                processedEmployees.add(empId);
                
                const employee = employeeMap.get(empId);
                const attendanceRecord = attendees.find(a => a.employee_id == empId);
                const session = filteredSessions.find(s => s.session_code === attendanceRecord?.session_code);
                
                if (employee) {
                    attendeesList.push({
                        id: employee.id,
                        fullName: employee.fullName || employee.name || 'غير معروف',
                        department: employee.department || '-',
                        position: employee.position || '-',
                        level: employee.level || '-',
                        sessionDate: session ? formatDate(session.session_date) : '-',
                        score: attendanceRecord?.score || '-'
                    });
                } else {
                    attendeesList.push({
                        id: empId,
                        fullName: 'غير مسجل (موظف غير موجود)',
                        department: '-',
                        position: '-',
                        level: '-',
                        sessionDate: session ? formatDate(session.session_date) : '-',
                        score: attendee.score || '-'
                    });
                }
            });

            attendeesList.sort((a, b) => a.fullName.localeCompare(b.fullName));
            
            currentAttendeesList = attendeesList;
            
            updateChartDeptOptions(attendeesList);
            renderDepartmentChart(attendeesList);
            
            const course = courses.find(c => c.course_code == courseCode);
            
            displayResults(attendeesList, course, filteredSessions.length, attendeesList.length);
        }

        function displayResults(attendeesList, course, sessionsCount, employeesCount, errorMessage = null) {
            const resultsDiv = document.getElementById('resultsCard');
            const tbody = document.getElementById('resultsTableBody');
            const courseNameSpan = document.getElementById('selectedCourseName');
            const sessionsCountSpan = document.getElementById('sessionsCount');
            const attendeesCountSpan = document.getElementById('attendeesCount');
            
            if (errorMessage) {
                courseNameSpan.textContent = 'لا توجد بيانات';
                sessionsCountSpan.textContent = '0';
                attendeesCountSpan.textContent = '0';
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:3rem;">${errorMessage}</td></tr>`;
                resultsDiv.style.display = 'block';
                return;
            }
            
            courseNameSpan.textContent = course ? course.course_name : 'تدريب غير محدد';
            sessionsCountSpan.textContent = sessionsCount;
            attendeesCountSpan.textContent = employeesCount;
            
            if (attendeesList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">🎉 لا يوجد موظفين حضروا هذا التدريب في الفترة المحددة</span></td>';
                resultsDiv.style.display = 'block';
                return;
            }
            
            tbody.innerHTML = attendeesList.map((emp, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${emp.id}</td>
                    <td style="text-align:right;">${emp.fullName}</td>
                    <td>${emp.department}</td>
                    <td>${emp.position}</td>
                    <td>${emp.level}</td>
                    <td>${emp.sessionDate}</td>
                    <td>${emp.score !== '-' ? `<span class="badge">${emp.score}%</span>` : '-'}</td>
                </tr>
            `).join('');
            
            resultsDiv.style.display = 'block';
        }

        function exportToExcel() {
            const courseCode = document.getElementById('courseSelect').value;
            const course = courses.find(c => c.course_code == courseCode);
            
            const rows = document.querySelectorAll('#resultsTableBody tr');
            if (rows.length === 0 || (rows.length === 1 && rows[0].innerText.includes('لا يوجد'))) {
                alert('❌ لا توجد بيانات للتصدير');
                return;
            }
            
            const exportData = [];
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length >= 8 && !cells[0].innerText.includes('لا يوجد')) {
                    exportData.push({
                        'م': cells[0]?.innerText || '',
                        'كود الموظف': cells[1]?.innerText || '',
                        'اسم الموظف': cells[2]?.innerText || '',
                        'القسم': cells[3]?.innerText || '',
                        'الوظيفة': cells[4]?.innerText || '',
                        'المستوى': cells[5]?.innerText || '',
                        'تاريخ الحضور': cells[6]?.innerText || '',
                        'درجة الاختبار': cells[7]?.innerText || ''
                    });
                }
            });
            
            if (exportData.length === 0) {
                alert('❌ لا توجد بيانات للتصدير');
                return;
            }
            
            let dateInfo = '';
            const dateTypeVal = document.getElementById('dateType').value;
            if (dateTypeVal === 'month') {
                const month = document.getElementById('monthSelect')?.value;
                dateInfo = month !== '-1' ? ` - شهر ${monthNames[parseInt(month)]}` : '';
            } else if (dateTypeVal === 'year') {
                const year = document.getElementById('yearSelect')?.value;
                dateInfo = year !== '-1' ? ` - سنة ${year}` : '';
            } else if (dateTypeVal === 'range') {
                const from = document.getElementById('fromDate')?.value;
                const to = document.getElementById('toDate')?.value;
                dateInfo = from && to ? ` - من ${from} إلى ${to}` : '';
            }
            
            const sessionsCount = document.getElementById('sessionsCount')?.innerText || '0';
            const attendeesCount = document.getElementById('attendeesCount')?.innerText || '0';
            
            const summary = [
                { 'ملخص التدريب': `التدريب: ${course?.course_name || ''}` },
                { 'ملخص التدريب': `عدد الجلسات المنفذة: ${sessionsCount}` },
                { 'ملخص التدريب': `إجمالي عدد الحضور: ${attendeesCount}` },
                { 'ملخص التدريب': '' },
                { 'ملخص التدريب': 'تفاصيل الحضور:' }
            ];
            
            const wsData = [...summary, ...exportData];
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, `حضور ${course?.course_name || 'تدريب'}${dateInfo}`);
            XLSX.writeFile(wb, `attendees_${course?.course_name || 'training'}_${new Date().toISOString().slice(0,10)}.xlsx`);
            
            alert(`✅ تم تصدير ${exportData.length} موظف بنجاح`);
        }

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>

    <style>

        }

            background: #f0f4f8;
        }

            background: #4299e1;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;

        /* ========== الحاوية الرئيسية ========== */

            max-width: 1400px;

        /* ========== رأس الصفحة ========== */

        .filter-card {

            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        
        .filter-group {
            display: flex;
            align-items: center;

        .filter-group label {

        .stat-card {

        .stat-value {

        .stat-label {

        /* ========== أزرار الإجراءات ========== */

            color: white;

        .print-btn { background: #4299e1; }

        /* ========== الجدول المتجاوب ========== */

        .training-table {

        .training-table td {

        /* ========== رسائل ========== */

            text-align: center;

        /* ========== تنبيهات منبثقة ========== */
        .toast-msg {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            left: 1rem;

            color: white;
            padding: 0.8rem;

        .toast-msg.error {
            background: #e53e3e;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);

            }
            to {
                transform: translateX(0);
                opacity: 1;
            }

        /* ========== رأس الجدول للجوال ========== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.8rem;

            }
            
            .training-table th,
            .training-table td {
                padding: 8px 5px;
            }

                font-size: 0.7rem;
            }
            
            .training-table td {
                font-size: 0.65rem;
            }
            
            .badge-category, .badge-hours {
                font-size: 0.6rem;
                padding: 0.15rem 0.4rem;
            }

        /* ========== شاشات صغيرة جداً (هواتف صغيرة) ========== */
        @media (max-width: 480px) {
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            
            .nav-links {
                justify-content: center;

            .page-header h1 {

            }
            
            .filter-card {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                justify-content: space-between;
            }
            
            .search-box {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box input {
                max-width: none;
                width: 100%;
            }
            
            .search-box button {
                width: 100%;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }

                text-align: center;
            }
            
            .training-table {

                min-width: 550px;
            }
            
            .training-table th,
            .training-table td {

            }

        /* ========== أجهزة لوحية ========== */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                padding: 0 1.2rem;
            }
            
            .stats-grid {

        /* ========== شاشات كبيرة ========== */

                max-width: 1600px;
            }
            
            .training-table {

<body>
<div id="app">جاري التحميل...</div>

<script>
// ========== Firebase Configuration ==========
var firebaseConfig = {
    apiKey: "AIzaSyA_P5crHXs4XvZVl73n6ikNodLTpsw25mk",
    authDomain: "training-2a75b.firebaseapp.com",
    projectId: "training-2a75b",
    storageBucket: "training-2a75b.firebasestorage.app",
    messagingSenderId: "849904887764",
    appId: "1:849904887764:web:b012d60c77b1851c169841"
};

if (firebase.apps.length === 0) {
    firebase.initializeApp(firebaseConfig);
}

var auth = firebase.auth();
var db = firebase.firestore();

// ========== مفاتيح الكاش ==========
var CACHE_KEYS = {
    EMPLOYEES: 'train_employees_v1',
    OFFJOB_COURSES: 'train_offjob_courses_v1',
    OFFJOB_SESSIONS: 'train_offjob_sessions_v1',
    OFFJOB_ENROLLMENTS: 'train_offjob_enrollments_v1',
    ONJOB_COURSES: 'train_onjob_courses_v1',
    ONJOB_SESSIONS: 'train_onjob_sessions_v1',
    ONJOB_ENROLLMENTS: 'train_onjob_enrollments_v1'
};

// ========== دوال مساعدة ==========
function showToast(message, isError) {
    var toast = document.createElement('div');
    toast.className = 'toast-msg';
    if (isError) toast.classList.add('error');
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 3000);
}

// ========== تحديث البيانات يدوياً ==========
function refreshData() {
    showToast("🔄 جاري تحديث البيانات...", false);
    if (window.CacheManager) {
        for (var key in CACHE_KEYS) {
            CacheManager.remove(CACHE_KEYS[key]);
            localStorage.removeItem(CACHE_KEYS[key] + '_time');
        }
    }
    loadEmployees(true)
        .then(function() { return loadOffJobData(true); })
        .then(function() { return loadOnJobData(true); })
        .then(renderPage)
        .then(function() { showToast("✅ تم تحديث البيانات بنجاح", false); })
        .catch(function(err) { console.error(err); });
}

// ========== تحميل البيانات من Firebase مع الكاش ==========
function loadEmployees(forceRefresh) {
    if (!forceRefresh && window.CacheManager) {
        var cached = CacheManager.get(CACHE_KEYS.EMPLOYEES);
        if (cached) {
            employees = cached;
            return Promise.resolve(employees);
        }
    }
    return db.collection("employees").get().then(function(snapshot) {
        employees = [];
        snapshot.forEach(function(doc) {
            var emp = doc.data();
            emp.id = doc.id;
            if (emp.status !== "Left") {
                employees.push(emp);
            }
        });
        if (window.CacheManager) {
            CacheManager.set(CACHE_KEYS.EMPLOYEES, employees);
            localStorage.setItem(CACHE_KEYS.EMPLOYEES + '_time', Date.now().toString());
        }
        return employees;
    });
}

function loadOffJobData(forceRefresh) {
    if (!forceRefresh && window.CacheManager) {
        var cachedCourses = CacheManager.get(CACHE_KEYS.OFFJOB_COURSES);
        var cachedSessions = CacheManager.get(CACHE_KEYS.OFFJOB_SESSIONS);
        var cachedEnrollments = CacheManager.get(CACHE_KEYS.OFFJOB_ENROLLMENTS);
        if (cachedCourses && cachedSessions && cachedEnrollments) {
            offJobCourses = cachedCourses;
            offJobSessions = cachedSessions;
            offJobEnrollments = cachedEnrollments;
            return Promise.resolve();
        }
    }
    return Promise.all([
        db.collection("offjob_courses").get(),
        db.collection("offjob_sessions").get(),
        db.collection("offjob_enrollments").get()
    ]).then(function(results) {
        offJobCourses = [];
        results[0].forEach(function(doc) { offJobCourses.push(doc.data()); });
        offJobSessions = [];
        results[1].forEach(function(doc) { offJobSessions.push(doc.data()); });
        offJobEnrollments = [];
        results[2].forEach(function(doc) { offJobEnrollments.push(doc.data()); });
        if (window.CacheManager) {
            CacheManager.set(CACHE_KEYS.OFFJOB_COURSES, offJobCourses);
            CacheManager.set(CACHE_KEYS.OFFJOB_SESSIONS, offJobSessions);
            CacheManager.set(CACHE_KEYS.OFFJOB_ENROLLMENTS, offJobEnrollments);
        }
    });
}

function loadOnJobData(forceRefresh) {
    if (!forceRefresh && window.CacheManager) {
        var cachedCourses = CacheManager.get(CACHE_KEYS.ONJOB_COURSES);
        var cachedSessions = CacheManager.get(CACHE_KEYS.ONJOB_SESSIONS);
        var cachedEnrollments = CacheManager.get(CACHE_KEYS.ONJOB_ENROLLMENTS);
        if (cachedCourses && cachedSessions && cachedEnrollments) {
            onJobCourses = cachedCourses;
            onJobSessions = cachedSessions;
            onJobEnrollments = cachedEnrollments;
            return Promise.resolve();
        }
    }
    return Promise.all([
        db.collection("onjob_courses").get(),
        db.collection("onjob_sessions").get(),
        db.collection("onjob_enrollments").get()
    ]).then(function(results) {
        onJobCourses = [];
        results[0].forEach(function(doc) { onJobCourses.push(doc.data()); });
        onJobSessions = [];
        results[1].forEach(function(doc) { onJobSessions.push(doc.data()); });
        onJobEnrollments = [];
        results[2].forEach(function(doc) { onJobEnrollments.push(doc.data()); });
        if (window.CacheManager) {
            CacheManager.set(CACHE_KEYS.ONJOB_COURSES, onJobCourses);
            CacheManager.set(CACHE_KEYS.ONJOB_SESSIONS, onJobSessions);
            CacheManager.set(CACHE_KEYS.ONJOB_ENROLLMENTS, onJobEnrollments);
        }
    });
}

// ========== متغيرات عامة ==========
var employees = [];
var offJobCourses = [];
var offJobSessions = [];
var offJobEnrollments = [];
var onJobCourses = [];
var onJobSessions = [];
var onJobEnrollments = [];

var currentEmployee = null;
var currentTrainings = [];
var selectedType = "offjob";

function formatDate(dateValue) {
    if (!dateValue) return '-';
    if (typeof dateValue === 'number') {
        var utcDays = dateValue - 25569;
        var date = new Date(utcDays * 86400000);
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
    }
    var dateStr = dateValue.toString();
    if (dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) return dateStr;
    return dateStr.split('T')[0];
}

function searchEmployee() {
    var empId = document.getElementById("employeeId").value;
    if (!empId) {
        alert("ادخل كود الموظف");
        return;
    }
    
    currentEmployee = null;
    for (var i = 0; i < employees.length; i++) {
        if (String(employees[i].id) === String(empId)) {
            currentEmployee = employees[i];
            break;
        }
    }
    
    if (!currentEmployee) {
        currentTrainings = [];
        renderPage();
        alert("الموظف غير موجود");
        return;
    }
    
    var allTrainings = [];
    
    if (selectedType === "all" || selectedType === "offjob") {
        var courseMap = {};
        for (var c = 0; c < offJobCourses.length; c++) { courseMap[offJobCourses[c].course_code] = offJobCourses[c]; }
        var sessionMap = {};
        for (var s = 0; s < offJobSessions.length; s++) { sessionMap[offJobSessions[s].session_code] = offJobSessions[s]; }
        for (var e = 0; e < offJobEnrollments.length; e++) {
            var enr = offJobEnrollments[e];
            if (String(enr.employee_id) === String(empId) && enr.enrollment_status === "Completed") {
                var session = sessionMap[enr.session_code];
                var course = session ? courseMap[session.course_code] : null;
                if (session) {
                    allTrainings.push({
                        date: formatDate(session.session_date),
                        course_name: course ? course.course_name : "غير محدد",
                        category: course ? course.category : "-",
                        trainer: session.trainer_name || "-",
                        hours: course ? Number(course.duration_hours) : 0,
                        score: enr.score || "N/A"
                    });
                }
            }
        }
    }
    
    if (selectedType === "all" || selectedType === "onjob") {
        var courseMap2 = {};
        for (var c2 = 0; c2 < onJobCourses.length; c2++) { courseMap2[onJobCourses[c2].course_code] = onJobCourses[c2]; }
        var sessionMap2 = {};
        for (var s2 = 0; s2 < onJobSessions.length; s2++) { sessionMap2[onJobSessions[s2].session_code] = onJobSessions[s2]; }
        for (var e2 = 0; e2 < onJobEnrollments.length; e2++) {
            var enr2 = onJobEnrollments[e2];
            if (String(enr2.employee_id) === String(empId) && enr2.enrollment_status === "Completed") {
                var session2 = sessionMap2[enr2.session_code];
                var course2 = session2 ? courseMap2[session2.course_code] : null;
                if (session2) {
                    allTrainings.push({
                        date: formatDate(session2.session_date),
                        course_name: course2 ? course2.course_name : "غير محدد",
                        category: course2 ? course2.category : "-",
                        trainer: session2.trainer_name || "-",
                        hours: course2 ? Number(course2.duration_hours) : 0,
                        score: enr2.score || "N/A"
                    });
                }
            }
        }
    }
    
    allTrainings.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    currentTrainings = allTrainings;
    renderPage();
}

function changeTrainingType() {
    var select = document.getElementById("trainingTypeSelect");
    if (select) {
        selectedType = select.value;
        if (currentEmployee) { searchEmployee(); }
    }
}

function logout() {
    if (window.CacheManager) {
        for (var key in CACHE_KEYS) {
            CacheManager.remove(CACHE_KEYS[key]);
            localStorage.removeItem(CACHE_KEYS[key] + '_time');
        }
    }
    auth.signOut().then(function() {
        sessionStorage.removeItem("loggedUser");
        window.location.href = "login.html";
    });
}

function exportToExcel() {
    var table = document.querySelector(".training-table");
    if (!table) return;
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.table_to_sheet(table);
    XLSX.utils.book_append_sheet(wb, ws, "سجل_التدريبات");
    XLSX.writeFile(wb, "سجل_تدريب.xlsx");
}

function printTable() {
    var table = document.querySelector(".training-table");
    if (!table) {
        alert("لا يوجد جدول لطباعته!");
        return;
    }
    
    var win = window.open("", "_blank");
    if (!win) return;
    
    var doc = win.document;
    doc.title = "سجل تدريب الموظف";
    
    var body = doc.body;
    body.style.direction = "rtl";
    body.style.fontFamily = "sans-serif";
    body.style.padding = "20px";
    
    var style = doc.createElement("style");
    style.textContent = "table{width:100%;border-collapse:collapse;margin-top:15px;} th,td{border:1px solid #ccc;padding:10px;text-align:center;} th{background:#f4f4f4;}";
    doc.head.appendChild(style);
    
    var h2 = doc.createElement("h2");
    h2.textContent = "سجل تدريب الموظف";
    body.appendChild(h2);
    
    var cloneTable = table.cloneNode(true);
    body.appendChild(cloneTable);
    
    setTimeout(function() {
        win.print();
    }, 300);
}

// ========== معالجة ضغط Enter ==========
function handleKeyPress(event) {
    if (event.key === 'Enter' || event.keyCode === 13) {
        event.preventDefault();
        searchEmployee();
    }
}

function renderPage() {
    var typeText = (selectedType === "all") ? "جميع التدريبات" : (selectedType === "offjob" ? "Off Job" : "On Job");
    var empIdValue = currentEmployee ? currentEmployee.id : "";
    
    var totalHours = 0;
    var uniqueCourses = {};
    var scores = [];
    for (var i = 0; i < currentTrainings.length; i++) {
        var t = currentTrainings[i];
        totalHours += t.hours;
        uniqueCourses[t.course_name] = true;
        if (t.score !== "N/A") { scores.push(parseInt(t.score)); }
    }
    var avgScore = "لا يوجد";
    if (scores.length > 0) {
        var sum = 0;
        for (var sc = 0; sc < scores.length; sc++) sum += scores[sc];
        avgScore = (sum / scores.length).toFixed(1);
    }
    var courseCount = Object.keys(uniqueCourses).length;
    
    var html = "";
    html += '<div class="navbar">';
    html += '<div class="logo"><h2>🎓 <span>نظام</span> إدارة التعليم والتطوير</h2></div>';
    html += '<div class="nav-links">';
    html += '<a href="index.html" class="home">🏠 الرئيسية</a>';
    html += '<button class="refresh-btn" onclick="refreshData()">🔄 تحديث</button>';
    html += '<a href="#" onclick="logout()" class="logout">🚪 تسجيل خروج</a>';
    html += '</div></div>';
    
    html += '<div class="container">';
    html += '<div class="page-header"><h1>📋 سجل تدريبات الموظف</h1></div>';
    html += '<div class="filter-card">';
    html += '<div class="filter-group"><label>نوع التدريب:</label>';
    html += '<select id="trainingTypeSelect" class="training-type-select" onchange="changeTrainingType()">';
    html += '<option value="all"' + (selectedType === "all" ? " selected" : "") + '>جميع التدريبات</option>';
    html += '<option value="offjob"' + (selectedType === "offjob" ? " selected" : "") + '>Off Job</option>';
    html += '<option value="onjob"' + (selectedType === "onjob" ? " selected" : "") + '>On Job</option>';
    html += '</select></div>';
    html += '<div class="filter-group"><span>عرض: ' + typeText + '</span></div>';
    html += '</div>';
    
    html += '<div class="search-card">';
    html += '<h3>أدخل كود الموظف</h3>';
    html += '<div class="search-box">';
html += '<input type="text" id="employeeId" placeholder="مثال: 12" value="' + empIdValue + '" onkeypress="handleKeyPress(event)">';    html += '<button onclick="searchEmployee()">عرض السجل التدريبي</button>';
    html += '</div></div>';
    
    if (currentEmployee) {
        html += '<div class="employee-info-card">';
        html += '<h2>👤 معلومات الموظف</h2>';
        html += '<div class="info-grid">';
        html += '<div><strong>🆔 الكود:</strong> ' + (currentEmployee.id || "-") + '</div>';
        html += '<div><strong>👨‍💼 الاسم:</strong> ' + (currentEmployee.fullName || "-") + '</div>';
        html += '<div><strong>🏢 القسم:</strong> ' + (currentEmployee.department || "-") + '</div>';
        html += '<div><strong>💼 الوظيفة:</strong> ' + (currentEmployee.position || "-") + '</div>';
        html += '<div><strong>⭐ المستوى:</strong> ' + (currentEmployee.level || "-") + '</div>';
        html += '</div></div>';
        
        html += '<div class="stats-grid">';
        html += '<div class="stat-card"><div class="stat-value">' + courseCount + '</div><div class="stat-label">📚 الكورسات</div></div>';
        html += '<div class="stat-card"><div class="stat-value">' + currentTrainings.length + '</div><div class="stat-label">🎯 الجلسات</div></div>';
        html += '<div class="stat-card"><div class="stat-value">' + totalHours.toFixed(1) + '</div><div class="stat-label">⏰ الساعات</div></div>';
        html += '<div class="stat-card"><div class="stat-value">' + avgScore + '</div><div class="stat-label">📊 متوسط الدرجة</div></div>';
        html += '</div>';
        
        html += '<div class="table-container">';
        html += '<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem;">';
        html += '<h3 style="font-size:1rem;">📚 سجل التدريبات المكتملة (' + typeText + ')</h3>';
        html += '<div style="display:flex; gap:0.5rem; flex-wrap:wrap;"><button class="action-btn print-btn" onclick="printTable()">🖨️ طباعة</button>';
        html += '<button class="action-btn excel-btn" onclick="exportToExcel()">📎 تصدير Excel</button></div></div>';
        
        if (currentTrainings.length > 0) {
            html += '<div class="table-wrapper"><table class="training-table"><thead><tr>';
            html += '<th>#</th><th>📅 التاريخ</th><th>📖 اسم الكورس</th>';
            html += '<th>🏷️ التصنيف</th><th>👨‍🏫 المدرب</th><th>⏱️ الساعات</th><th>📝 الدرجة</th>';
            html += '</tr></thead><tbody>';
            
            for (var j = 0; j < currentTrainings.length; j++) {
                var tr = currentTrainings[j];
                var scoreVal = (tr.score === "N/A") ? 0 : parseInt(tr.score);
                var bgColor = "#e2e8f0";
                var scoreText = "";
                if (scoreVal >= 85) { bgColor = "#c6f6d5"; scoreText = "ممتاز"; }
                else if (scoreVal >= 70) { bgColor = "#feebc8"; scoreText = "جيد جداً"; }
                else if (scoreVal >= 50) { bgColor = "#fed7d7"; scoreText = "مقبول"; }
                
                html += '<tr>';
                html += '<td>' + (j + 1) + '</td>';
                html += '<td>' + (tr.date || "-") + '</td>';
                html += '<td style="text-align:right;">' + tr.course_name + '</td>';
                html += '<td><span class="badge-category">' + tr.category + '</span></td>';
                html += '<td>' + tr.trainer + '</td>';
                html += '<td><span class="badge-hours">' + tr.hours + ' س</span></td>';
                html += '<td><span style="background:' + bgColor + ';padding:0.2rem 0.5rem;border-radius:1rem;">' + tr.score + (scoreText ? " (" + scoreText + ")" : "") + '</span></td>';
                html += '</tr>';
            }
            html += '</tbody></table></div>';
        } else {
            html += '<div class="empty-msg">📭 لا توجد تدريبات مكتملة مسجلة لهذا الموظف في ' + typeText + '</div>';
        }
        html += '</div>';
    }
    
    html += '</div><div class="footer"><p>© 2026 نظام إدارة التعليم والتطوير</p></div>';
    document.getElementById("app").innerHTML = html;
}

// تحميل أولي للبيانات
Promise.all([
    loadEmployees(false),
    loadOffJobData(false),
    loadOnJobData(false)
]).then(function() {
    renderPage();
        window.handleKeyPress = handleKeyPress;  
}).catch(function(err) {
    console.error("Initialization Error:", err);
});
</script>

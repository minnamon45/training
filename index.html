<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيقات إضافية */
        .view-count { 
            background: #e2e8f0; 
            color: #4a5568; 
            font-size: 0.7rem; 
            padding: 0.2rem 0.6rem; 
            border-radius: 1rem; 
            margin-right: 0.5rem;
        }
        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { registerView } from "./analytics.js";
        
        let appData = null;
        let isAdmin = false;
        
        async function loadData() {
            const sectionsSnap = await getDocs(collection(db, "sections"));
            const linksSnap = await getDocs(collection(db, "links"));
            const sections = sectionsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            const links = linksSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            appData = sections.map(s => ({ 
                ...s, 
                links: links.filter(l => l.sectionId == s.id).map(l => ({ ...l, id: l.id }))
            }));
        }
        
        async function checkAdmin(user) {
            const adminDoc = await getDoc(doc(db, "admins", user.uid));
            isAdmin = adminDoc.exists();
            if (!isAdmin) {
                const adminEmails = ["admin@test.com", "mina@test.com"];
                isAdmin = adminEmails.includes(user.email);
            }
        }
        
// دالة معالجة النقر على الرابط (تسجيل الزيارة ثم التوجيه)
function handleLinkClick(linkId, url, event) {
    event.preventDefault(); // منع التوجيه المباشر
    
    // تسجيل الزيارة
    registerView(linkId).then(() => {
        // بعد تسجيل الزيارة، التوجه إلى الرابط في نفس الصفحة
        window.location.href = url;
    }).catch(() => {
        // حتى لو فشل التسجيل، نفتح الرابط في نفس الصفحة
        window.location.href = url;
    });
}
        
        function render() {
            document.getElementById("app").innerHTML = `
                <div class="navbar">
                    <div class="logo"><h2>🎓 <span>نظام</span> إدارة التعليم والتطوير</h2></div>
                    <div class="nav-links" id="navLinks"></div>
                </div>
                <div class="hero">
                    <h1>مرحباً بك في نظام التدريب</h1>
                    <p>منصة متكاملة لإدارة التدريب والتطوير</p>
                </div>
                <div class="search-container">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="بحث عن قسم أو رابط...">
                        <button onclick="window.searchContent()">بحث</button>
                    </div>
                    <div id="searchResults" class="search-results"></div>
                </div>
                <div class="container">
                    <div id="sectionsContainer" class="sections-grid">
                        ${appData.map(s => `
                            <div class="section-card">
                                <div class="section-header">
                                    <div class="section-icon">${s.icon || "📁"}</div>
                                    <div>
                                        <h3>${escapeHtml(s.name)}</h3>
                                        <small>${escapeHtml(s.description || "")}</small>
                                    </div>
                                </div>
                                <div class="links-list">
                                    ${(s.links || []).map(l => `
                                        <a href="#" class="link-item" data-link-id="${l.id}" data-link-url="${l.url}" onclick="window.handleLinkClick('${l.id}', '${l.url}', event)">
                                            <span class="link-title">🔗 ${escapeHtml(l.title)}</span>
                                            <span class="view-count">👁️ ${l.views || 0}</span>
                                        </a>
                                    `).join("")}
                                </div>
                            </div>
                        `).join("")}
                    </div>
                </div>
                <div class="footer">
                    <p>© 2025 نظام إدارة التعليم والتطوير - جميع الحقوق محفوظة</p>
                </div>
            `;
            
            // ربط الدوال
            window.handleLinkClick = handleLinkClick;
            buildNav();
        }
        
        function buildNav() {
            const nav = document.getElementById("navLinks");
            if (!nav) return;
            let html = `<span class="user-welcome">👋 ${escapeHtml(window.currentUser?.email || 'مستخدم')}</span>`;
            if (isAdmin) html += `<a href="admin.html" class="admin-btn" style="background:#2b7a4b;">⚙️ لوحة التحكم</a>`;
            html += `<a href="#" id="logoutBtn" class="logout-btn" style="background:#e53e3e;">🚪 خروج</a>`;
            nav.innerHTML = html;
            document.getElementById("logoutBtn")?.addEventListener("click", async () => { await signOut(auth); window.location.href = "login.html"; });
        }
        
        function escapeHtml(text) { 
            if (!text) return ''; 
            const div = document.createElement('div'); 
            div.textContent = text; 
            return div.innerHTML; 
        }
        
        window.searchContent = () => {
            const input = document.getElementById("searchInput");
            const resultsDiv = document.getElementById("searchResults");
            const val = input?.value.toLowerCase().trim();
            if (!val || val.length < 2) { if(resultsDiv) resultsDiv.style.display = "none"; return; }
            let results = [];
            appData.forEach(s => { 
                if(s.name.toLowerCase().includes(val)) results.push({ type: "section", name: s.name }); 
                s.links?.forEach(l => { 
                    if(l.title.toLowerCase().includes(val)) results.push({ type: "link", name: l.title, url: l.url, id: l.id }); 
                }); 
            });
            resultsDiv.innerHTML = results.map(r => `
                <div class="search-result-item" onclick="window.handleLinkClick('${r.id || ''}', '${r.url || '#'}', event)">
                    ${r.type === "section" ? "📁" : "🔗"} ${escapeHtml(r.name)}
                </div>
            `).join("");
            resultsDiv.style.display = "block";
        };
        
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            window.currentUser = user;
            await checkAdmin(user);
            await loadData();
            render();
            document.body.style.visibility = "visible";
        });
    </script>
</body>
</html>

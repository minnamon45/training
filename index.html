<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f4f7fc; visibility: visible; }

        .navbar {
            background: white;
            padding: 0.8rem 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .logo h2 { color: #0a2540; font-size: 1.2rem; font-weight: 700; }
        .logo span { color: #2c7a4d; }
        .nav-links { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
        .nav-links a, .nav-links button {
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-size: 0.8rem;
            color: white;
        }
        .user-welcome { color: #5a6874; font-size: 0.85rem; margin-left: 0.5rem; }
        .admin-btn { background: #2c7a4d; }
        .logout-btn { background: #dc2626; }

        .hero {
            text-align: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #0a2540, #2c7a4d);
            color: white;
        }
        .hero h1 { font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700; }
        .hero p { opacity: 0.9; font-size: 1rem; }

        .search-container {
            max-width: 600px;
            margin: -1.5rem auto 1.5rem;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }
        .search-box {
            display: flex;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .search-icon {
            padding: 0.8rem 0.5rem 0.8rem 1rem;
            font-size: 1.2rem;
        }
        .search-box input {
            flex: 1;
            border: none;
            padding: 0.8rem 0.5rem;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .search-box button {
            background: #2c7a4d;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }
        .search-box button:hover { background: #1e5a38; }
        .search-results {
            display: none;
            background: white;
            border-radius: 1rem;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 300px;
            overflow-y: auto;
        }
        .search-result-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #e2edf2;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .search-result-item:hover { background: #f7fafc; }

        .container { max-width: 1400px; margin: 1.5rem auto; padding: 0 1rem; }
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }
        .section-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .section-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .section-header {
            background: linear-gradient(135deg, #0a2540, #2c7a4d);
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .section-icon { font-size: 2rem; }
        .section-header h3 { font-size: 1rem; margin-bottom: 0.2rem; font-weight: 600; }
        .section-header small { opacity: 0.8; font-size: 0.75rem; }
        .links-list { padding: 0.5rem; }
        .links-list a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 0.8rem;
            text-decoration: none;
            color: #0a2540;
            border-radius: 0.5rem;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .links-list a:hover { background: #f7fafc; }
        .link-title { font-weight: 500; }
        .view-count {
            background: #e2edf2;
            color: #5a6874;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            white-space: nowrap;
        }
        .loading-message {
            text-align: center;
            padding: 3rem;
            color: #5a6874;
            font-size: 1.1rem;
        }
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2edf2;
            border-top: 4px solid #2c7a4d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .empty-message {
            text-align: center;
            padding: 3rem;
            color: #5a6874;
            grid-column: 1 / -1;
        }
        .footer { text-align: center; padding: 1.5rem; color: #5a6874; font-size: 0.8rem; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; text-align: center; }
            .hero h1 { font-size: 1.4rem; }
            .hero p { font-size: 0.9rem; }
            .sections-grid { grid-template-columns: 1fr; }
            .search-box input { font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .hero { padding: 1.5rem 0.8rem; }
            .hero h1 { font-size: 1.2rem; }
            .section-icon { font-size: 1.5rem; }
            .section-header h3 { font-size: 0.9rem; }
            .links-list a { font-size: 0.8rem; padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { collection, getDocs, getDocsFromCache, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { registerView } from "./analytics.js";
        
        let appData = null;
        let isAdmin = false;
        
        async function loadData() {
            try {
                console.log("🔄 ========== Starting data load ==========");
                
                // ✅ Load from Firebase directly
                const sectionsSnap = await getDocs(collection(db, "sections"));
                const linksSnap = await getDocs(collection(db, "links"));
                
                console.log("☁️ Loaded from Firebase");
                
                // ✅ Extract sections
                const sections = [];
                sectionsSnap.forEach(doc => {
                    const data = doc.data();
                    console.log("📁 Section - doc.id:", doc.id, "type:", typeof doc.id);
                    console.log("📁 Section - data:", JSON.stringify(data));
                    sections.push({ 
                        id: doc.id,
                        name: data.name || "Unnamed",
                        icon: data.icon || "📁",
                        description: data.description || ""
                    });
                });
                
                // ✅ Extract links
                const links = [];
                linksSnap.forEach(doc => {
                    const data = doc.data();
                    console.log("🔗 Link - doc.id:", doc.id, "type:", typeof doc.id);
                    console.log("🔗 Link - data:", JSON.stringify(data));
                    console.log("🔗 Link - sectionId:", data.sectionId, "type:", typeof data.sectionId);
                    links.push({ 
                        id: doc.id,
                        title: data.title || "Untitled",
                        url: data.url || "#",
                        type: data.type || "internal",
                        views: data.views || 0,
                        pinned: data.pinned || false,
                        sectionId: data.sectionId
                    });
                });
                
                console.log("📊 Total sections:", sections.length);
                console.log("📊 Total links:", links.length);
                
                // ✅ Match links to sections
                appData = sections.map(s => {
                    const sectionLinks = links.filter(l => {
                        const match1 = String(l.sectionId) === String(s.id);
                        const match2 = Number(l.sectionId) === Number(s.id);
                        const match3 = l.sectionId == s.id;
                        
                        if (match1 || match2 || match3) {
                            return true;
                        }
                        return false;
                    });
                    
                    console.log(`📁 "${s.name}" (id: ${s.id}, type: ${typeof s.id}) -> ${sectionLinks.length} links`);
                    console.log(`   sectionIds present:`, links.map(l => `${l.sectionId} (${typeof l.sectionId})`).join(', '));
                    
                    return { 
                        ...s, 
                        links: sectionLinks
                    };
                });
                
                // ✅ If no links matched, show all links in first section
                const totalLinks = appData.reduce((sum, s) => sum + s.links.length, 0);
                console.log("📊 Total matched links:", totalLinks);
                
                if (totalLinks === 0 && links.length > 0 && sections.length > 0) {
                    console.warn("⚠️ Link matching failed! Displaying all links in first section");
                    appData[0].links = links.map(l => ({ ...l, id: l.id }));
                }
                
                console.log("✅ ========== Load complete ==========");
                return true;
            } catch (error) {
                console.error("❌ Load failed:", error);
                appData = [];
                return false;
            }
        }
        
        async function checkAdmin(user) {
            try {
                const adminDoc = await getDoc(doc(db, "admins", user.uid));
                isAdmin = adminDoc.exists();
                
                if (isAdmin) {
                    console.log("✅ Admin authorized:", user.email);
                }
            } catch (error) {
                console.error("❌ Admin check failed:", error);
                isAdmin = false;
            }
        }
        
        // ========== Handle link click ==========
        function handleLinkClick(linkId, url, event) {
            if (event) event.preventDefault();
            
            if (!url || url === "#") return;
            
            // Register view then redirect
            registerView(linkId).then(() => {
                window.location.href = url;
            }).catch(() => {
                window.location.href = url;
            });
        }
        
        // ========== Show initial UI quickly ==========
        function showInitialUI(user) {
            document.getElementById("app").innerHTML = `
                <div class="navbar">
                    <div class="logo"><h2>🎓 <span>Training</span> & Development System</h2></div>
                    <div class="nav-links" id="navLinks">
                        <span class="user-welcome">👋 Welcome, ${escapeHtml(user?.email || 'User')}</span>
                    </div>
                </div>
                <div class="hero">
                    <h1>Welcome to Training Dashboard</h1>
                </div>
                <div class="search-container">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Search for section or link..." onkeypress="if(event.key==='Enter')window.searchContent()">
                        <button onclick="window.searchContent()">Search</button>
                    </div>
                    <div id="searchResults" class="search-results"></div>
                </div>
                <div class="container">
                    <div id="sectionsContainer" class="sections-grid">
                        <div class="loading-message" style="grid-column: 1 / -1;">
                            <div class="loading-spinner"></div>
                            <p>⏳ Loading sections and links...</p>
                        </div>
                    </div>
                </div>
                <div class="footer">
                    <p>© 2025 Training & Development System - All Rights Reserved</p>
                </div>
            `;
        }
        
        // ========== Update sections after data load ==========
        function updateSections() {
            const container = document.getElementById("sectionsContainer");
            if (!container) return;
            
            if (!appData || appData.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        <p style="font-size:2rem;">📭</p>
                        <p>No sections available</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = appData.map(s => `
                <div class="section-card">
                    <div class="section-header">
                        <div class="section-icon">${s.icon || "📁"}</div>
                        <div>
                            <h3>${escapeHtml(s.name)}</h3>
                            <small>${escapeHtml(s.description || "")}</small>
                        </div>
                    </div>
                    <div class="links-list">
                        ${(s.links || []).length > 0 
                            ? (s.links || []).map(l => `
                                <a href="#" class="link-item" onclick="window.handleLinkClick('${l.id}', '${escapeHtml(l.url)}', event)">
                                    <span class="link-title">🔗 ${escapeHtml(l.title)}</span>
                                    <span class="view-count">👁️ ${l.views || 0}</span>
                                </a>
                            `).join("")
                            : '<div style="text-align:center; padding:1rem; color:#a0aec0;">No links available</div>'
                        }
                    </div>
                </div>
            `).join("");
        }
        
        // ========== Build navigation bar ==========
        function buildNav() {
            const nav = document.getElementById("navLinks");
            if (!nav) return;
            
            let html = `<span class="user-welcome">👋 Welcome, ${escapeHtml(window.currentUser?.email || 'User')}</span>`;
            
            // ✅ Admin panel button appears only for admins
            if (isAdmin) {
                html += `<a href="admin.html" class="admin-btn">⚙️ Admin Panel</a>`;
            }
            
            html += `<a href="#" id="logoutBtn" class="logout-btn">🚪 Logout</a>`;
            nav.innerHTML = html;
            
            document.getElementById("logoutBtn")?.addEventListener("click", async (e) => {
                e.preventDefault();
                await signOut(auth);
                window.location.href = "login.html";
            });
        }
        
        // ========== Search functionality ==========
        window.searchContent = () => {
            const input = document.getElementById("searchInput");
            const resultsDiv = document.getElementById("searchResults");
            const val = input?.value.toLowerCase().trim();
            
            if (!val || val.length < 2) {
                if (resultsDiv) resultsDiv.style.display = "none";
                return;
            }
            
            let results = [];
            appData.forEach(s => {
                if (s.name.toLowerCase().includes(val)) {
                    results.push({ type: "section", name: s.name });
                }
                (s.links || []).forEach(l => {
                    if (l.title.toLowerCase().includes(val)) {
                        results.push({ type: "link", name: l.title, url: l.url, id: l.id });
                    }
                });
            });
            
            if (results.length === 0) {
                resultsDiv.innerHTML = '<div class="search-result-item" style="color:#a0aec0;">🔍 No results found</div>';
            } else {
                resultsDiv.innerHTML = results.map(r => `
                    <div class="search-result-item" onclick="window.handleLinkClick('${r.id || ''}', '${r.url || '#'}', event)">
                        ${r.type === "section" ? "📁" : "🔗"} ${escapeHtml(r.name)}
                    </div>
                `).join("");
            }
            
            resultsDiv.style.display = "block";
        };
        
        // ========== Helper functions ==========
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // ========== Initialize application ==========
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            
            window.currentUser = user;
            
            // ✅ Show initial UI immediately
            showInitialUI(user);
            
            // ✅ Bind global functions
            window.handleLinkClick = handleLinkClick;
            
            // ✅ Load data in background
            const [adminResult, dataResult] = await Promise.all([
                checkAdmin(user),
                loadData()
            ]);
            
            // ✅ Update page with data
            updateSections();
            buildNav();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Long Beach Resort - نظام التعليم والتطوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#003B7A">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        :root {
            /* Long Beach Resort Brand Colors */
            --lb-navy: #003B7A;        /* الأزرق الداكن من اللوجو */
            --lb-navy-dark: #002855;   /* أغمق للأزرار */
            --lb-orange: #FF8C42;      /* البرتقالي من اللوجو */
            --lb-orange-dark: #E8751A; /* برتقالي أغمق */
            --lb-cream: #FFF9F0;       /* بيج فاتح جداً */
            --lb-sand: #F5EFE6;        /* بيج رملي */
            
            --primary: var(--lb-navy);
            --secondary: var(--lb-orange);
            --accent: var(--lb-orange);
            --bg: #F7F9FC;
            --text: #1a202c;
            --text-light: #64748b;
            --shadow: 0 10px 40px rgba(0, 59, 122, 0.08);
            --shadow-hover: 0 20px 60px rgba(0, 59, 122, 0.18);
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --radius: 1.5rem;
        }
        body { background: var(--bg); color: var(--text); transition: var(--transition); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--lb-navy); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--lb-orange); }

        /* ===== NAVBAR ===== */
        .navbar { 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(20px); 
            padding: 0.8rem 2.5rem; 
            box-shadow: 0 2px 30px rgba(0, 59, 122, 0.06); 
            display: flex; justify-content: space-between; align-items: center; 
            flex-wrap: wrap; gap: 1rem; 
            position: sticky; top: 0; z-index: 1000; 
            transition: var(--transition); 
            border-bottom: 3px solid transparent; 
        }
        .navbar.scrolled { 
            border-bottom: 3px solid var(--lb-orange); 
            box-shadow: 0 4px 40px rgba(255, 140, 66, 0.15); 
        }
        .navbar-brand {
            display: flex; align-items: center; gap: 0.8rem;
        }
        .navbar-brand .brand-icon {
            width: 45px; height: 45px; border-radius: 0.8rem;
            background: linear-gradient(135deg, var(--lb-navy), var(--lb-navy-dark));
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 1.4rem; font-weight: 900;
            box-shadow: 0 5px 15px rgba(0, 59, 122, 0.3);
        }
        .logo h2 { 
            color: var(--lb-navy); font-size: 1.4rem; font-weight: 900;
            line-height: 1.2;
        }
        .logo h2 span { color: var(--lb-orange); }
        .logo .subtitle {
            font-size: 0.7rem; color: var(--text-light); font-weight: 600;
            letter-spacing: 0.5px;
        }
        .nav-links { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
        .nav-links a, .nav-links button, .nav-links span { 
            text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 2rem; 
            font-weight: 600; cursor: pointer; border: none; font-size: 0.85rem; 
            transition: var(--transition); display: flex; align-items: center; gap: 0.4rem; 
            font-family: 'Tajawal', sans-serif;
        }
        .nav-links a:hover, .nav-links button:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
        .nav-links .offjob-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .nav-links .onjob-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .nav-links .performers-btn { background: linear-gradient(135deg, var(--lb-orange), var(--lb-orange-dark)); color: white; }
        .nav-links .admin { background: linear-gradient(135deg, #9f7aea, #6b46c1); color: white; }
        .nav-links .update-btn { background: linear-gradient(135deg, var(--lb-navy), var(--lb-navy-dark)); color: white; }
        .nav-links .logout { background: linear-gradient(135deg, #fc8181, #e53e3e); color: white; }
        .nav-links .dark-mode-btn { 
            background: var(--lb-navy); color: white; 
            padding: 0.6rem 0.9rem; font-size: 1rem; 
        }
        .nav-links .dark-mode-btn:hover { background: var(--lb-orange); transform: rotate(20deg); }

        /* ===== HERO ===== */
        .hero { 
            background: linear-gradient(135deg, var(--lb-navy) 0%, var(--lb-navy-dark) 100%);
            padding: 5rem 2rem 6rem; text-align: center; color: white; 
            position: relative; overflow: hidden; min-height: 340px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .hero::before { 
            content: ''; position: absolute; top: -50%; left: -50%; 
            width: 200%; height: 200%; 
            background: radial-gradient(circle at 30% 50%, rgba(255, 140, 66, 0.15) 0%, transparent 60%); 
            animation: heroGlow 8s ease-in-out infinite alternate; 
        }
        .hero::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
            background: linear-gradient(to top right, transparent 49%, var(--bg) 50%);
        }
        @keyframes heroGlow { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(10%, 10%) scale(1.1); } 
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(255, 140, 66, 0.15);
            border: 1px solid rgba(255, 140, 66, 0.3);
            padding: 0.5rem 1.2rem; border-radius: 2rem;
            font-size: 0.85rem; font-weight: 600;
            margin-bottom: 1.5rem; position: relative; z-index: 1;
            animation: fadeInUp 0.8s ease;
        }
        .hero-badge .dot {
            width: 8px; height: 8px; background: var(--lb-orange);
            border-radius: 50%; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }
        .hero h1 { 
            font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900; 
            position: relative; z-index: 1; animation: fadeInUp 1s ease; 
            line-height: 1.3; max-width: 900px;
        }
        .hero h1 .highlight { 
            color: var(--lb-orange); position: relative; display: inline-block;
        }
        .hero h1 .highlight::after { 
            content: ''; position: absolute; bottom: -5px; right: 0; left: 0;
            height: 4px; background: var(--lb-orange); border-radius: 10px;
            animation: underlinePulse 2s infinite;
        }
        @keyframes underlinePulse {
            0%, 100% { transform: scaleX(1); opacity: 1; }
            50% { transform: scaleX(0.6); opacity: 0.6; }
        }
        .hero p { 
            font-size: clamp(0.95rem, 1.5vw, 1.15rem); 
            opacity: 0.85; margin-top: 1.2rem; 
            position: relative; z-index: 1; 
            animation: fadeInUp 1.2s ease;
            max-width: 700px; line-height: 1.7;
        }
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .floating-shapes { position: absolute; width: 100%; height: 100%; top: 0; left: 0; overflow: hidden; z-index: 0; }
        .shape { position: absolute; border-radius: 50%; opacity: 0.08; animation: float 15s infinite ease-in-out; }
        .shape:nth-child(1) { width: 120px; height: 120px; background: var(--lb-orange); top: 10%; left: 5%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 180px; height: 180px; background: white; bottom: 5%; right: 5%; animation-delay: 3s; }
        .shape:nth-child(3) { width: 80px; height: 80px; background: var(--lb-orange); top: 50%; right: 20%; animation-delay: 6s; }
        .shape:nth-child(4) { width: 100px; height: 100px; background: white; top: 20%; left: 40%; animation-delay: 4s; }
        @keyframes float { 
            0%, 100% { transform: translate(0, 0) scale(1); } 
            25% { transform: translate(30px, -30px) scale(1.1); } 
            50% { transform: translate(-20px, 20px) scale(0.9); } 
            75% { transform: translate(20px, -10px) scale(1.05); } 
        }

        /* ===== SEARCH ===== */
        .search-container { max-width: 900px; margin: -2.5rem auto 2.5rem; padding: 0 1.5rem; position: relative; z-index: 10; }
        .search-box { 
            background: white; border-radius: 3rem; padding: 0.4rem 1.8rem; 
            display: flex; align-items: center; gap: 0.8rem; 
            box-shadow: 0 15px 50px rgba(0, 59, 122, 0.12); 
            transition: var(--transition); 
            border: 2px solid transparent; position: relative; 
        }
        .search-box:focus-within { 
            border-color: var(--lb-orange); 
            box-shadow: 0 20px 60px rgba(255, 140, 66, 0.25); 
            transform: translateY(-2px); 
        }
        .search-box .search-icon { font-size: 1.2rem; color: #a0aec0; transition: var(--transition); }
        .search-box:focus-within .search-icon { color: var(--lb-orange); }
        .search-box input { 
            flex: 1; padding: 1rem 0; border: none; background: transparent; 
            font-size: 1rem; outline: none; color: var(--text); 
            font-family: 'Tajawal', sans-serif;
        }
        .search-box input::placeholder { color: #a0aec0; }
        .search-box .search-clear { 
            background: none; border: none; font-size: 1.2rem; 
            cursor: pointer; color: #a0aec0; display: none; 
            padding: 0.3rem 0.5rem; transition: var(--transition); 
            border-radius: 50%; 
        }
        .search-box .search-clear:hover { color: #e53e3e; background: #fed7d7; transform: scale(1.1); }
        .search-box .search-shortcut { 
            font-size: 0.7rem; color: #a0aec0; background: #edf2f7; 
            padding: 0.25rem 0.7rem; border-radius: 0.5rem; 
            font-weight: 600; direction: ltr; 
        }
        .search-box:focus-within .search-shortcut { display: none; }
        #searchResults { 
            background: white; border-radius: 1.5rem; margin-top: 0.8rem; 
            box-shadow: 0 25px 70px rgba(0, 59, 122, 0.15); 
            max-height: 450px; overflow-y: auto; 
            display: none; padding: 0.5rem; position: relative; 
        }
        #searchResults.active { display: block; animation: slideDown 0.3s ease; }
        @keyframes slideDown { 
            from { opacity: 0; transform: translateY(-15px) scale(0.98); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }
        #searchResults .search-loading { text-align: center; padding: 2rem; color: #a0aec0; }
        #searchResults .search-loading .spinner { 
            display: inline-block; width: 30px; height: 30px; 
            border: 3px solid #e2e8f0; border-top: 3px solid var(--lb-orange); 
            border-radius: 50%; animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .search-result-item { 
            padding: 0.8rem 1.2rem; border-radius: 1rem; cursor: pointer; 
            transition: var(--transition); display: flex; align-items: center; 
            gap: 0.8rem; border-bottom: 1px solid #f0f4f8; 
        }
        .search-result-item:hover { 
            background: linear-gradient(135deg, #FFF9F0, #FEF3E2); 
            transform: translateX(-5px); 
        }
        .search-result-item .icon { 
            font-size: 1.5rem; width: 42px; height: 42px; 
            display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #F7F9FC, #EDF2F7); 
            border-radius: 0.8rem; flex-shrink: 0; 
        }
        .search-result-item .info { flex: 1; }
        .search-result-item .info .title { font-weight: 600; color: var(--text); }
        .search-result-item .info .title mark { 
            background: #FFF3D6; padding: 0 0.2rem; 
            border-radius: 0.2rem; color: var(--lb-navy); font-weight: 700;
        }
        .search-result-item .info .sub { 
            font-size: 0.8rem; color: #a0aec0; 
            margin-top: 0.15rem; display: flex; align-items: center; gap: 0.5rem; 
        }
        .search-result-item .badge { 
            font-size: 0.65rem; padding: 0.25rem 0.7rem; 
            border-radius: 1rem; background: #e2e8f0; 
            color: #4a5568; flex-shrink: 0; font-weight: 600; 
        }
        .search-result-item .badge.link { background: #FEF3E2; color: var(--lb-orange-dark); }
        .search-result-item .badge.section { background: #E0EAF7; color: var(--lb-navy); }
        .search-filters { 
            display: flex; gap: 0.5rem; padding: 0.5rem 0.5rem 0.8rem 0.5rem; 
            border-bottom: 1px solid #f0f4f8; flex-wrap: wrap; 
        }
        .search-filters .filter-btn { 
            padding: 0.35rem 1rem; border-radius: 2rem; 
            border: 1px solid #e2e8f0; background: transparent; 
            font-size: 0.75rem; cursor: pointer; 
            transition: var(--transition); color: var(--text-light); 
            font-weight: 600; font-family: 'Tajawal', sans-serif;
        }
        .search-filters .filter-btn:hover { background: #F7F9FC; }
        .search-filters .filter-btn.active { 
            background: var(--lb-navy); color: white; 
            border-color: var(--lb-navy); 
        }

        /* ===== SECTIONS ===== */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 1.5rem 3rem; }
        .section-header-main {
            text-align: center; margin-bottom: 2.5rem;
        }
        .section-header-main h2 {
            font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 900;
            color: var(--lb-navy); margin-bottom: 0.5rem;
        }
        .section-header-main p {
            color: var(--text-light); font-size: 1rem;
        }
        .sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .section-card { 
            background: white; border-radius: var(--radius); padding: 1.8rem; 
            box-shadow: var(--shadow); transition: var(--transition); 
            position: relative; overflow: hidden; 
            border: 2px solid transparent; 
            opacity: 0; transform: translateY(40px); 
        }
        .section-card.visible { opacity: 1; transform: translateY(0); }
        .section-card::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; 
            height: 5px; 
            background: linear-gradient(90deg, var(--lb-navy), var(--lb-orange)); 
            transform: scaleX(0); transform-origin: right; 
            transition: var(--transition); 
        }
        .section-card:hover::before { transform: scaleX(1); }
        .section-card:hover { 
            transform: translateY(-10px) scale(1.01); 
            box-shadow: var(--shadow-hover); 
            border-color: var(--lb-orange); 
        }
        .section-card .section-header { 
            display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; 
        }
        .section-card .section-icon { 
            font-size: 2.5rem; width: 60px; height: 60px; 
            display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #F7F9FC, #E0EAF7); 
            border-radius: 1rem; transition: var(--transition); flex-shrink: 0; 
        }
        .section-card:hover .section-icon { 
            background: linear-gradient(135deg, var(--lb-navy), var(--lb-navy-dark)); 
            transform: rotate(10deg) scale(1.1); 
        }
        .section-card .section-title { 
            font-size: 1.25rem; font-weight: 800; color: var(--lb-navy); 
        }
        .section-card .section-desc { 
            color: var(--text-light); font-size: 0.9rem; 
            margin-bottom: 1rem; line-height: 1.6; 
        }
        .section-card .links-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
        .section-card .link-item { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0.7rem 1rem; background: #F7F9FC; 
            border-radius: 0.8rem; transition: var(--transition); 
            text-decoration: none; color: var(--text); 
            border-right: 3px solid transparent;
        }
        .section-card .link-item:hover { 
            background: linear-gradient(135deg, var(--lb-navy), var(--lb-navy-dark)); 
            color: white; transform: translateX(-5px); 
            border-right-color: var(--lb-orange);
        }
        .section-card .link-item .link-title { 
            font-weight: 500; font-size: 0.9rem; 
            display: flex; align-items: center; gap: 0.5rem; 
        }
        .section-card .pinned-badge { 
            background: var(--lb-orange); color: white; 
            padding: 0.15rem 0.6rem; border-radius: 1rem; 
            font-size: 0.65rem; font-weight: 700; 
        }
        .section-card .empty-links { text-align: center; padding: 1rem; color: #a0aec0; }
        .footer { 
            text-align: center; padding: 2.5rem; 
            color: var(--text-light); background: white; 
            border-top: 1px solid #e2e8f0; font-size: 0.9rem; 
        }
        .footer .footer-brand {
            display: inline-flex; align-items: center; gap: 0.5rem;
            margin-bottom: 0.5rem; font-weight: 700; color: var(--lb-navy);
        }

        /* ===== DARK MODE ===== */
        body.dark-mode { 
            --bg: #0f1c2e; --text: #f7fafc; 
            --text-light: #94a3b8; 
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4); 
            --shadow-hover: 0 20px 60px rgba(255, 140, 66, 0.15); 
        }
        body.dark-mode .navbar { background: rgba(15, 28, 46, 0.98); }
        body.dark-mode .logo h2 { color: #f7fafc; }
        body.dark-mode .search-box { background: #1e2d44; }
        body.dark-mode .search-box input { color: #f7fafc; }
        body.dark-mode .search-box .search-shortcut { background: #2d3d56; color: #94a3b8; }
        body.dark-mode #searchResults { background: #1e2d44; }
        body.dark-mode .search-result-item { border-bottom-color: #2d3d56; }
        body.dark-mode .search-result-item:hover { background: #2d3d56; }
        body.dark-mode .search-result-item .info .title { color: #f7fafc; }
        body.dark-mode .search-result-item .icon { background: #2d3d56; }
        body.dark-mode .search-filters { border-bottom-color: #2d3d56; }
        body.dark-mode .search-filters .filter-btn { border-color: #2d3d56; color: #94a3b8; }
        body.dark-mode .search-filters .filter-btn:hover { background: #2d3d56; }
        body.dark-mode .search-filters .filter-btn.active { background: var(--lb-orange); color: white; border-color: var(--lb-orange); }
        body.dark-mode .section-card { background: #1e2d44; }
        body.dark-mode .section-card .section-title { color: #f7fafc; }
        body.dark-mode .section-card .link-item { background: #2d3d56; color: #f7fafc; }
        body.dark-mode .section-card .section-icon { background: #2d3d56; }
        body.dark-mode .footer { background: #1e2d44; border-top-color: #2d3d56; }
        body.dark-mode .footer .footer-brand { color: #f7fafc; }
        body.dark-mode .section-header-main h2 { color: #f7fafc; }

        /* ===== TOAST ===== */
        .toast-msg { 
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); 
            background: linear-gradient(135deg, var(--lb-navy), var(--lb-navy-dark)); 
            color: white; padding: 0.9rem 2rem; border-radius: 2rem; 
            box-shadow: 0 10px 40px rgba(0, 59, 122, 0.3); 
            z-index: 9999; animation: slideUp 0.3s ease; 
            font-weight: 600; display: flex; align-items: center; gap: 0.5rem;
        }
        .toast-msg.error { 
            background: linear-gradient(135deg, #ef4444, #dc2626); 
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3); 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateX(-50%) translateY(20px); } 
            to { opacity: 1; transform: translateX(-50%) translateY(0); } 
        }

        /* ===== LOADING ===== */
        .loading-state {
            grid-column: 1/-1; text-align: center; padding: 4rem;
        }
        .loading-state .big-spinner {
            font-size: 3rem; animation: spin 1s infinite linear;
            display: inline-block;
        }

        @media (max-width: 768px) { 
            .hero { padding: 3rem 1.5rem 4rem; } 
            .navbar { padding: 0.8rem 1rem; flex-direction: column; }
            .navbar-brand { width: 100%; justify-content: center; }
            .sections-grid { grid-template-columns: 1fr; } 
            .search-container { padding: 0 1rem; margin-top: -2rem; } 
            .nav-links { width: 100%; justify-content: center; }
            .nav-links a, .nav-links button, .nav-links span { padding: 0.45rem 0.9rem; font-size: 0.75rem; } 
            .search-box .search-shortcut { display: none; } 
            .search-filters { justify-content: center; } 
        }
        @media (max-width: 480px) { 
            .hero h1 { font-size: 1.5rem; } 
            .hero p { font-size: 0.9rem; } 
            .search-box { padding: 0.3rem 1rem; }
            .search-box input { padding: 0.8rem 0; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div style="text-align:center; padding:100px; font-size:1.5rem; color:var(--lb-navy);">
            جاري تهيئة النظام والتحقق من الصلاحيات... ⏳
        </div>
    </div>

    <script type="module">
        import { auth, DB } from './database.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        // متغيرات النظام
        let currentUser = null;
        let isAdmin = false;
        let darkMode = localStorage.getItem('darkMode') === 'true';

        let cachedSections = [];
        let cachedLinks = [];

        // ===== TOAST =====
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            if (isError) toast.classList.add('error');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== DARK MODE =====
        function toggleDarkMode() {
            darkMode = !darkMode;
            localStorage.setItem('darkMode', darkMode);
            document.body.classList.toggle('dark-mode', darkMode);
            updateNavbar();
        }

        // ===== UPDATE NAVBAR =====
        function updateNavbar() {
            const navLinks = document.getElementById('navLinks');
            if (!navLinks) return;

            const darkIcon = darkMode ? '☀️' : '🌙';

            navLinks.innerHTML = `
                <a href="reports-offjob.html" class="offjob-btn"><i class="fas fa-chart-bar"></i> Off Job</a>
                <a href="reports-onjob.html" class="onjob-btn"><i class="fas fa-chart-line"></i> On Job</a>
                <a href="top-performers.html" class="performers-btn"><i class="fas fa-trophy"></i> التحليل</a>
                ${isAdmin ? `<a href="admin.html" class="admin"><i class="fas fa-cog"></i> التحكم</a>` : ''}
                <button class="update-btn" onclick="refreshData()"><i class="fas fa-sync-alt"></i> تحديث</button>
                <button class="dark-mode-btn" onclick="toggleDarkMode()">${darkIcon}</button>
                <button onclick="logout()" class="logout" style="border:none;"><i class="fas fa-sign-out-alt"></i> خروج</button>
            `;

            document.querySelectorAll('.nav-links a:not([target="_blank"])').forEach(link => {
                const href = link.getAttribute('href');
                if (href && !href.startsWith('http') && !href.startsWith('//') && href !== '#') {
                    link.setAttribute('target', '_self');
                }
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== LOGOUT =====
        async function logout() {
            try {
                await signOut(auth);
                showToast('👋 تم تسجيل الخروج بنجاح');
                setTimeout(() => window.location.href = 'login.html', 500);
            } catch(error) {
                showToast('❌ حدث خطأ أثناء تسجيل الخروج', true);
            }
        }

        // دالة التحميل الفعالة
        async function loadDataAndRender() {
            await DB.init();
            cachedSections = await DB.getAll('sections') || [];
            cachedLinks = await DB.getAll('links') || [];
            renderSections();
        }

        // ===== REFRESH DATA =====
        window.refreshData = () => {
            const container = document.getElementById('sectionsContainer');
            if (container) {
                container.innerHTML = '<div class="loading-state"><div class="big-spinner">🔄</div><p style="margin-top:1rem; color:var(--text-light);">جاري تحديث البيانات...</p></div>';
            }
            
            const isDark = localStorage.getItem('darkMode');
            
            localStorage.clear();
            sessionStorage.clear();
            
            if (isDark !== null) localStorage.setItem('darkMode', isDark);
            
            showToast('✅ تم تنظيف الذاكرة.. جاري التحديث');

            setTimeout(() => {
                const newUrl = window.location.pathname + '?refresh=' + new Date().getTime();
                window.location.href = newUrl;
            }, 800);
        };

        // ===== RENDER SECTIONS =====
        function renderSections() {
            const container = document.getElementById('sectionsContainer');
            if (!container) return;

            const sectionsWithLinks = cachedSections.map(section => ({
                ...section,
                links: cachedLinks.filter(link => String(link.sectionId) === String(section.id))
            }));

            if (sectionsWithLinks.length === 0) {
                container.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:4rem; background:white; border-radius:2rem; box-shadow:var(--shadow);">
                        <div style="font-size:4rem; margin-bottom:1rem;">📂</div>
                        <h3 style="color:var(--text-light);">لا توجد أقسام بعد</h3>
                        <p style="color:#a0aec0; margin-top:0.5rem;">تواصل مع المدير لإضافة الأقسام والروابط</p>
                    </div>
                `;
                return;
            }

            sectionsWithLinks.sort((a, b) => {
                const aHasPinned = a.links.some(l => l.pinned);
                const bHasPinned = b.links.some(l => l.pinned);
                if (aHasPinned && !bHasPinned) return -1;
                if (!aHasPinned && bHasPinned) return 1;
                return 0;
            });

            container.innerHTML = sectionsWithLinks.map((section, index) => {
                const sortedLinks = [...section.links].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
                const delay = index * 0.1;

                return `
                    <div class="section-card" style="transition-delay: ${delay}s;" id="section-${section.id}">
                        <div class="section-header">
                            <div class="section-icon"><span>${section.icon || '📁'}</span></div>
                            <div>
                                <div class="section-title">${escapeHtml(section.name)}</div>
                                <div class="section-desc">${escapeHtml(section.description || '')}</div>
                            </div>
                        </div>
                        <div class="links-list">
                            ${sortedLinks.length > 0 ? sortedLinks.map(link => `
                                <a href="${link.url || '#'}" class="link-item" onclick="handleLinkClick(event)">
                                    <span class="link-title">
                                        <span class="link-icon">${link.pinned ? '📌' : '🔗'}</span>
                                        <span>${escapeHtml(link.title)}</span>
                                        ${link.pinned ? '<span class="pinned-badge">مثبت</span>' : ''}
                                    </span>
                                </a>
                            `).join('') : '<div class="empty-links">📭 لا توجد روابط حالياً</div>'}
                        </div>
                    </div>
                `;
            }).join('');

            setTimeout(() => {
                const cards = document.querySelectorAll('.section-card');
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
                cards.forEach(card => observer.observe(card));
            }, 100);
        }

        // ===== HANDLE LINK CLICK =====
        function handleLinkClick(event) {
            const linkElement = event.currentTarget;
            const href = linkElement.getAttribute('href');

            if (!href || href === '#') {
                event.preventDefault();
                return;
            }

            const isInternalLink = href.startsWith('#') || href.startsWith('index.html') || href.startsWith('./') || href.endsWith('.html') || !href.startsWith('http');

            if (isInternalLink) {
                event.preventDefault();
                window.location.href = href;
            } else {
                event.preventDefault();
                window.open(href, '_blank');
            }
        }

        // ===== SEARCH LOGIC =====
        let searchTimeout = null;
        let currentFilter = 'all';

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            searchContent();
        }

        async function searchContent() {
            const input = document.getElementById('searchInput');
            const resultsContainer = document.getElementById('searchResults');
            const query = input.value.trim();

            document.querySelector('.search-clear').style.display = query ? 'block' : 'none';

            if (!query || query.length < 2) {
                resultsContainer.classList.remove('active');
                resultsContainer.innerHTML = '';
                return;
            }

            resultsContainer.innerHTML = `<div class="search-loading"><div class="spinner"></div><p style="margin-top:0.5rem;">جاري البحث...</p></div>`;
            resultsContainer.classList.add('active');

            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                
                const sections = cachedSections;
                const links = cachedLinks;

                const searchTerm = query.toLowerCase();
                const results = [];

                sections.forEach(section => {
                    const nameMatch = section.name.toLowerCase().includes(searchTerm);
                    const descMatch = section.description && section.description.toLowerCase().includes(searchTerm);
                    if (nameMatch || descMatch) {
                        results.push({ type: 'section', name: section.name, id: section.id, icon: section.icon || '📁', description: section.description || '', match: nameMatch ? 'الاسم' : 'الوصف' });
                    }
                });

                links.forEach(link => {
                    const section = sections.find(s => String(s.id) === String(link.sectionId));
                    if (!section) return;

                    const titleMatch = link.title.toLowerCase().includes(searchTerm);
                    const urlMatch = link.url && link.url.toLowerCase().includes(searchTerm);
                    if (titleMatch || urlMatch) {
                        results.push({ type: 'link', name: link.title, linkId: link.id, sectionId: section.id, sectionName: section.name, sectionIcon: section.icon || '📁', url: link.url || '#', pinned: link.pinned || false, match: titleMatch ? 'العنوان' : 'الرابط' });
                    }
                });

                let filteredResults = results;
                if (currentFilter === 'sections') {
                    filteredResults = results.filter(r => r.type === 'section');
                } else if (currentFilter === 'links') {
                    filteredResults = results.filter(r => r.type === 'link');
                }

                if (filteredResults.length === 0) {
                    resultsContainer.innerHTML = `<div style="padding:2rem; text-align:center; color:#a0aec0;"><div style="font-size:3rem;">🔍</div><p>لا توجد نتائج لـ "<strong>${escapeHtml(query)}</strong>"</p><p style="font-size:0.8rem; margin-top:0.3rem;">جرب كلمات بحث مختلفة</p></div>`;
                    return;
                }

                let html = `<div class="search-filters"><button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" data-filter="all" onclick="setFilter('all')">الكل (${results.length})</button><button class="filter-btn ${currentFilter === 'sections' ? 'active' : ''}" data-filter="sections" onclick="setFilter('sections')">📂 أقسام (${results.filter(r => r.type === 'section').length})</button><button class="filter-btn ${currentFilter === 'links' ? 'active' : ''}" data-filter="links" onclick="setFilter('links')">🔗 روابط (${results.filter(r => r.type === 'link').length})</button></div>`;

                filteredResults.forEach(r => {
                    if (r.type === 'section') {
                        html += `<div class="search-result-item" onclick="goToResult('section', '${r.id}')"><span class="icon">${r.icon}</span><div class="info"><div class="title">${highlightText(r.name, searchTerm)}</div><div class="sub"><span>📄 ${escapeHtml(r.description || 'لا يوجد وصف')}</span><span class="section-tag">${r.match}</span></div></div><span class="badge section">قسم</span></div>`;
                    } else {
                        const isInternal = r.url && (r.url.startsWith('#') || r.url.endsWith('.html') || !r.url.startsWith('http'));
                        const clickHandler = isInternal ? `window.location.href='${r.url}'` : `window.open('${r.url}', '_blank')`;
                        html += `<div class="search-result-item" onclick="${clickHandler};"><span class="icon">${r.pinned ? '📌' : '🔗'}</span><div class="info"><div class="title">${highlightText(r.name, searchTerm)}</div><div class="sub"><span>${r.sectionIcon} ${escapeHtml(r.sectionName)}</span>${r.pinned ? '<span class="section-tag">⭐ مثبت</span>' : ''}<span class="section-tag">${r.match}</span></div></div><span class="badge link">رابط</span></div>`;
                    }
                });
                resultsContainer.innerHTML = html;
            }, 100); 
        }

        function highlightText(text, term) {
            if (!text || !term) return escapeHtml(text);
            const escaped = escapeHtml(text);
            const regex = new RegExp(`(${escapeHtml(term)})`, 'gi');
            return escaped.replace(regex, '<mark>$1</mark>');
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.remove('active');
            document.getElementById('searchResults').innerHTML = '';
            document.querySelector('.search-clear').style.display = 'none';
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === 'all'));
        }

        function goToResult(type, id) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.classList.remove('active');
            resultsDiv.innerHTML = '';
            document.getElementById('searchInput').value = '';
            document.querySelector('.search-clear').style.display = 'none';
            currentFilter = 'all';

            if (type === 'section') {
                const element = document.getElementById(`section-${id}`);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    element.style.boxShadow = '0 0 0 3px var(--lb-orange)';
                    element.style.borderColor = 'var(--lb-orange)';
                    setTimeout(() => { element.style.boxShadow = ''; element.style.borderColor = 'transparent'; }, 2500);
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && e.key === 'k') || (e.ctrlKey && e.key === '/')) {
                e.preventDefault(); document.getElementById('searchInput').focus();
            }
            if (e.key === 'Escape') {
                if (document.getElementById('searchResults').classList.contains('active')) clearSearch();
            }
        });

        // ===== INIT UI AFTER AUTH =====
        function initUI() {
            document.getElementById('app').innerHTML = `
                <div class="navbar" id="navbar">
                    <div class="navbar-brand">
                        <div class="logo">
                            <h2>Long Beach <span>Resort</span></h2>
                            <div class="subtitle">Learning & Development System</div>
                        </div>
                    </div>
                    <div class="nav-links" id="navLinks"></div>
                </div>
                <div class="hero">
                    <div class="floating-shapes">
                        <div class="shape"></div>
                        <div class="shape"></div>
                        <div class="shape"></div>
                        <div class="shape"></div>
                    </div>

                    <h1><span class="highlight">نظام التعليم</span> والتطوير</h1>
                </div>
                <div class="search-container">
                    <div class="search-box">
                        <span class="search-icon"><i class="fas fa-search"></i></span>
                        <input type="text" id="searchInput" placeholder="ابحث عن قسم أو رابط..." onkeyup="searchContent()" autocomplete="off">
                        <button class="search-clear" onclick="clearSearch()">✕</button>
                        <span class="search-shortcut">Ctrl + K</span>
                    </div>
                    <div id="searchResults"></div>
                </div>
                <div class="container">
                    <div class="sections-grid" id="sectionsContainer"></div>
                </div>
                <div class="footer">
                    <div class="footer-brand">
                        <span>🏖️</span>
                        <span>Long Beach Resort</span>
                    </div>
                    <p>© 2026 نظام إدارة التعليم والتطوير - جميع الحقوق محفوظة</p>
                </div>
            `;

            updateNavbar();
            
            loadDataAndRender();

            window.addEventListener('scroll', () => {
                const navbar = document.getElementById('navbar');
                if (window.scrollY > 50) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');
            });

            if (darkMode) document.body.classList.add('dark-mode');
        }

        // إتاحة الدوال للاستخدام المباشر
        window.toggleDarkMode = toggleDarkMode;
        window.logout = logout;
        window.searchContent = searchContent;
        window.clearSearch = clearSearch;
        window.goToResult = goToResult;
        window.setFilter = setFilter;
        window.handleLinkClick = handleLinkClick;
        window.refreshData = refreshData;

        // ===== AUTH GUARD =====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    await DB.init();
                    const usersList = await DB.getAll('users') || [];
                    const foundUser = usersList.find(u => u.email === user.email || String(u.id) === String(user.uid));
                    
                    currentUser = foundUser || { username: user.email, email: user.email, role: 'user' };
                    isAdmin = currentUser.role === 'admin';
                    
                    initUI();
                } catch(err) {
                    console.error("خطأ في جلب بيانات المستخدم", err);
                    window.location.href = 'login.html';
                }
            } else {
                window.location.href = 'login.html';
            }
        });

    </script>
</body>
</html>

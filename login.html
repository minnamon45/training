<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة التعليم والتطوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3a5f, #2b7a4b); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-card { background: white; border-radius: 2rem; padding: 2.5rem; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .logo { font-size: 4rem; margin-bottom: 1rem; }
        .login-card h1 { color: #1e3a5f; margin-bottom: 0.5rem; }
        .login-card p { color: #718096; margin-bottom: 2rem; }
        input { width: 100%; padding: 1rem; margin: 0.8rem 0; border: 2px solid #e2e8f0; border-radius: 1rem; font-size: 1rem; transition: 0.3s; }
        input:focus { outline: none; border-color: #2b7a4b; box-shadow: 0 0 0 3px rgba(43,122,75,0.1); }
        button { width: 100%; padding: 1rem; background: linear-gradient(135deg, #1e3a5f, #2b7a4b); color: white; border: none; border-radius: 1rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .toast-msg { position: fixed; bottom: 2rem; right: 2rem; background: #2b7a4b; color: white; padding: 0.8rem 1.5rem; border-radius: 2rem; z-index: 1000; animation: slideIn 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .toast-msg.error { background: #e53e3e; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .loading { display: none; margin-top: 1rem; color: #2b7a4b; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🎓</div>
        <h1>نظام إدارة التعليم والتطوير</h1>
        <p>سجل دخولك للوصول إلى النظام</p>
        <input type="email" id="email" placeholder="📧 البريد الإلكتروني" autocomplete="off">
        <input type="password" id="password" placeholder="🔒 كلمة المرور" onkeypress="if(event.key === 'Enter') login()">
        <button onclick="login()">دخول</button>
        <div id="loadingMsg" class="loading">⏳ جاري تسجيل الدخول...</div>
    </div>

    <script type="module">
        import { auth } from "./firebase.js";
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        
        // دالة عرض الرسائل المنبثقة
        function showToast(message, isError = false) {
            // إزالة أي توست موجود مسبقاً
            const existingToast = document.querySelector('.toast-msg');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = 'toast-msg' + (isError ? ' error' : '');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
        
        // دالة الحصول على رسالة خطأ مفهومة
        function getFriendlyErrorMessage(error) {
            const errorMessages = {
                'auth/invalid-credential': '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة',
                'auth/wrong-password': '❌ كلمة المرور غير صحيحة',
                'auth/user-not-found': '❌ لا يوجد حساب مرتبط بهذا البريد الإلكتروني',
                'auth/invalid-email': '❌ البريد الإلكتروني غير صالح',
                'auth/too-many-requests': '❌ تم تعطيل الحساب مؤقتاً بسبب كثرة المحاولات، حاول لاحقاً',
                'auth/network-request-failed': '❌ يرجى التحقق من اتصال الإنترنت',
                'auth/internal-error': '❌ حدث خطأ داخلي، يرجى المحاولة لاحقاً'
            };
            return errorMessages[error.code] || '❌ فشل تسجيل الدخول. يرجى المحاولة مرة أخرى';
        }
        
        onAuthStateChanged(auth, (user) => { 
            if (user) window.location.href = 'index.html'; 
        });
        
        window.login = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loadingMsg = document.getElementById('loadingMsg');
            const loginBtn = document.querySelector('button');
            
            if (!email || !password) {
                showToast('❌ الرجاء إدخال البريد الإلكتروني وكلمة المرور', true);
                return;
            }
            
            loadingMsg.style.display = 'block';
            loginBtn.disabled = true;
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast('✅ تم تسجيل الدخول بنجاح، جاري التحويل...');
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
            } catch (error) {
                console.error("Login error:", error);
                showToast(getFriendlyErrorMessage(error), true);
            } finally {
                loadingMsg.style.display = 'none';
                loginBtn.disabled = false;
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة التعليم والتطوير</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a5f, #2b7a4b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            border-radius: 2rem;
            padding: 2.5rem;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .login-card h1 {
            color: #1e3a5f;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: #718096;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            margin: 0.8rem 0;
            border: 2px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2b7a4b;
            box-shadow: 0 0 0 3px rgba(43, 122, 75, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1e3a5f, #2b7a4b);
            color: white;
            border: none;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-top: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .loading {
            display: none;
            margin-top: 1rem;
            color: #2b7a4b;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">🎓</div>
        <h1>نظام إدارة التعليم والتطوير</h1>
        <p>سجل دخولك للوصول إلى النظام</p>

        <input type="email" id="email" placeholder="📧 البريد الإلكتروني" autocomplete="off">
        <input type="password" id="password" placeholder="🔒 كلمة المرور"
            onkeypress="if(event.key === 'Enter') login()">
        <button onclick="login()">دخول</button>

        <div id="loadingMsg" class="loading">⏳ جاري تسجيل الدخول...</div>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        // تهيئة Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA_P5crHXs4XvZVl73n6ikNodLTpsw25mk",
            authDomain: "training-2a75b.firebaseapp.com",
            projectId: "training-2a75b",
            storageBucket: "training-2a75b.firebasestorage.app",
            messagingSenderId: "849904887764",
            appId: "1:849904887764:web:b012d60c77b1851c169841"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        // التحقق من حالة تسجيل الدخول عند تحميل الصفحة
        auth.onAuthStateChanged((user) => {
            if (user) {
                // مستخدم مسجل دخول بالفعل
                console.log("User already logged in:", user.email);
                window.location.href = 'index.html';
            }
        });

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loadingMsg = document.getElementById('loadingMsg');
            const loginBtn = document.querySelector('button');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!email || !password) {
                showError('❌ الرجاء إدخال البريد الإلكتروني وكلمة المرور');
                return;
            }

            loadingMsg.style.display = 'block';
            loginBtn.disabled = true;

            try {
                // تسجيل الدخول باستخدام Firebase Authentication
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                console.log("✅ Login successful:", user.email);

                // حفظ معلومات المستخدم في الجلسة
                sessionStorage.setItem('loggedUser', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    role: 'user' // يمكن جلب الدور من Firestore إذا كان موجود
                }));

                showSuccess('✅ تسجيل الدخول ناجح... جاري التحويل');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error("Login error:", error);

                let errorMessage = '❌ فشل تسجيل الدخول';
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = '❌ لا يوجد مستخدم بهذا البريد الإلكتروني';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '❌ كلمة المرور غير صحيحة';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '❌ البريد الإلكتروني غير صالح';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = '❌ تم تعطيل الحساب مؤقتاً بسبب كثرة المحاولات. حاول لاحقاً';
                        break;
                    default:
                        errorMessage = '❌ خطأ في تسجيل الدخول: ' + error.message;
                }

                showError(errorMessage);
            } finally {
                loadingMsg.style.display = 'none';
                loginBtn.disabled = false;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 4000);
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.backgroundColor = '#c6f6d5';
            errorDiv.style.color = '#22543d';
            errorDiv.style.display = 'block';
        }
    </script>
</body>

</html>

        const EXAM_REQUIRED_COURSES = [
            'food safety', 'سلامة الغذاء', 'haccp', 'fire fighting', 'السلامة والصحة المهنية'
        ];

        function isExamRequired(courseName) {
            if (!courseName) return false;
            const courseNameLower = courseName.toLowerCase();
            return EXAM_REQUIRED_COURSES.some(keyword => courseNameLower.includes(keyword));
        }

        // ========== دالة فحص تاريخ التوظيف ==========
        function getHireYear(employee) {
            if (!employee || !employee.hireDate) return null;
            
            let hireDateStr = employee.hireDate;
            
            // لو التاريخ رقم Excel
            if (typeof hireDateStr === 'number') {
                const utcDays = hireDateStr - 25569;
                const date = new Date(utcDays * 86400000);
                return date.getFullYear();
            }
            
            // لو التاريخ نص
            if (typeof hireDateStr === 'string') {
                // صيغة YYYY-MM-DD
                const match = hireDateStr.match(/^(\d{4})/);
                if (match) return parseInt(match[1]);
                
                // نحول لـ Date
                const date = new Date(hireDateStr);
                if (!isNaN(date.getTime())) return date.getFullYear();
            }
            
            return null;
        }

function isNewHire(employee) {
    const hireYear = getHireYear(employee);
    if (!hireYear) {
        console.log('⚠️ الموظف ' + employee.id + ' ليس له تاريخ تعيين');
        return false;
    }
    const isNew = hireYear === currentYear;
    if (isNew) {
        console.log('🆕 الموظف ' + employee.id + ' (' + employee.fullName + ') معين في ' + hireYear);
    }
    return isNew;
}

function hasAttendedNewHireInduction(employeeId) {
    const newHireCourseNames = [
        'new hire induction', 
        'تعريف الموظفين الجدد',
        'new hire',
        'employee induction',
        'induction'
    ];
    
    // ✅ البحث عن كورس تعريف الموظفين الجدد
    const newHireCourse = courses.find(c => {
        const courseName = (c.course_name || '').toLowerCase();
        const courseCode = String(c.course_code || '').toLowerCase();
        return newHireCourseNames.some(name => 
            courseName.includes(name) || courseCode.includes(name)
        );
    });
    
    if (!newHireCourse) {
        console.warn('⚠️ لم يتم العثور على كورس تعريف الموظفين الجدد في offjob_courses');
        return false;
    }
    
    console.log('📚 كورس تعريف الموظفين الجدد:', newHireCourse.course_name, '(code:', newHireCourse.course_code, ')');
    
    // ✅ البحث عن جلسات هذا الكورس
    const newHireSessions = sessions.filter(s => 
        String(s.course_code).trim() === String(newHireCourse.course_code).trim()
    );
    
    console.log('📊 عدد جلسات تعريف الموظفين الجدد:', newHireSessions.length);
    
    if (newHireSessions.length === 0) return false;
    
    const newHireSessionCodes = newHireSessions.map(s => String(s.session_code).trim());
    
    // ✅ فحص إذا كان الموظف حضر أي من هذه الجلسات
    const hasAttended = enrollments.some(e => {
        const empIdMatch = String(e.employee_id).trim() === String(employeeId).trim();
        const sessionMatch = newHireSessionCodes.includes(String(e.session_code).trim());
        const status = String(e.enrollment_status || '').trim().toLowerCase();
        const isCompleted = (status === 'completed' || status === 'مكتمل' || status === 'pass');
        
        return empIdMatch && sessionMatch && isCompleted;
    });
    
    if (hasAttended) {
        console.log('✅ الموظف ' + employeeId + ' حضر تعريف الموظفين الجدد');
    }
    
    return hasAttended;
}

        async function loadEmployeesFromFirebase(forceRefresh = false) {
            try {
                if (!forceRefresh && window.CacheManager) {
                    const cached = CacheManager.get(CACHE_KEYS.EMPLOYEES);
                    if (cached) {
                        console.log("📦 استخدام الكاش للموظفين");
                        employees = cached;
                        return employees;
                    }
                }
                
                console.log("☁️ جلب الموظفين من Firebase");
                const snapshot = await db.collection('employees').get();
                employees = [];
                snapshot.forEach(doc => {
                    const emp = { id: doc.id, ...doc.data() };
                    if (emp.status !== 'Left') {
                        employees.push(emp);
                    }
                });
                
                // ✅ ترتيب حسب تاريخ التوظيف (الأحدث أولاً)
                employees.sort((a, b) => {
                    const hireA = getHireYear(a) || 0;
                    const hireB = getHireYear(b) || 0;
                    return hireB - hireA;
                });
                
                if (window.CacheManager) {
                    CacheManager.set(CACHE_KEYS.EMPLOYEES, employees);
                    localStorage.setItem(CACHE_KEYS.EMPLOYEES + '_time', Date.now().toString());
                }
                
                // ✅ إحصائيات الموظفين الجدد
                const newHiresCount = employees.filter(e => isNewHire(e)).length;
                console.log('✅ تم تحميل ' + employees.length + ' موظف (منهم ' + newHiresCount + ' موظف جديد في ' + currentYear + ')');
                return employees;
            } catch (error) {
                console.error("❌ خطأ في تحميل الموظفين:", error);
                employees = [];
                return [];
            }
        }

        function onCourseChange() {

            const filtersSection = document.getElementById('filtersSection');

            const newHireOnlySection = document.getElementById('newHireOnlySection');

            if (filtersSection) filtersSection.style.display = 'block';

            const course = courses.find(c => String(c.course_code).trim() === String(courseCode).trim());
            const examRequired = course && isExamRequired(course.course_name);
            const scoreSection = document.getElementById('scoreSection');
            const examNote = document.getElementById('examNote');
            
            // ✅ إخفاء/إظهار تشيك بوكس New Hire
            const isNewHireCourse = (course?.course_name || '').toLowerCase().includes('new hire') || 
                                    (course?.course_name || '').toLowerCase().includes('تعريف الموظفين');
            if (excludeNewHireSection) {

            }

                examNote.style.display = examRequired ? 'block' : 'none';
            }
        }

        // ========== الحصول على الموظفين الذين حضروا الكورس ==========
        function getEmployeesWhoAttendedCourse(courseCode) {
            const targetCourseCode = String(courseCode).trim();
            const course = courses.find(c => String(c.course_code).trim() === targetCourseCode);
            const examRequired = course && isExamRequired(course.course_name);
            
            const courseSessions = sessions.filter(s => String(s.course_code).trim() === targetCourseCode);
            const sessionCodes = courseSessions.map(s => String(s.session_code).trim());
            
            const employeeAttendance = new Map();
            const employeeScores = new Map();
            
            enrollments.forEach(e => {
                const empIdStr = String(e.employee_id).trim();
                const sessionCodeStr = String(e.session_code).trim();
                
                if (sessionCodes.includes(sessionCodeStr)) {
                    const status = String(e.enrollment_status || '').trim().toLowerCase();
                    const isCompleted = (status === 'completed' || status === 'مكتمل' || status === 'pass');
                    
                    if (isCompleted) {
                        employeeAttendance.set(empIdStr, true);
                    }
                    
                    if (e.score !== undefined && e.score !== null && e.score !== "") {
                        const currentScore = parseFloat(e.score);
                        if (!employeeScores.has(empIdStr) || currentScore > employeeScores.get(empIdStr)) {
                            employeeScores.set(empIdStr, currentScore);
                        }
                    }
                }
            });
            
            return { employeeAttendance, employeeScores, examRequired };
        }

function findRequiredEmployees() {
    const courseCode = document.getElementById('courseSelect')?.value;
    const minScoreStr = document.getElementById('minScore')?.value;
    const minScore = minScoreStr ? parseFloat(minScoreStr) : 75;
    
    const excludeNewHire = document.getElementById('excludeNewHireCheckbox')?.checked || false;
    const newHireOnly = document.getElementById('newHireOnlyCheckbox')?.checked || false;
    
    const selectedLevels = Array.from(document.querySelectorAll('.level-cb:checked')).map(cb => cb.value.trim().toLowerCase());
    const selectedDepts = Array.from(document.querySelectorAll('.dept-cb:checked')).map(cb => cb.value.trim().toLowerCase());

    if (!courseCode) return alert('❌ الرجاء اختيار الكورس');
    if (selectedDepts.length === 0) return alert('❌ الرجاء اختيار قسم واحد على الأقل');
    if (selectedLevels.length === 0) return alert('❌ الرجاء اختيار فئة واحدة على الأقل');
    
    const course = courses.find(c => String(c.course_code).trim() === String(courseCode).trim());
    const { employeeAttendance, employeeScores, examRequired } = getEmployeesWhoAttendedCourse(courseCode);
    
    const courseNameLower = (course?.course_name || '').toLowerCase();
    const isNewHireCourse = courseNameLower.includes('new hire') || 
                            courseNameLower.includes('تعريف الموظفين');
    
    console.log('🔍 ========== بدء البحث ==========');
    console.log('📋 الكورس المختار:', course?.course_name);
    console.log('📋 هو كورس تعريف موظفين جدد؟:', isNewHireCourse);
    console.log('📋 السنة الحالية:', currentYear);
    
    // ✅ لما الكورس يكون New Hire Induction، نجيب الموظفين الجدد فقط تلقائياً
    const effectiveNewHireOnly = isNewHireCourse ? true : newHireOnly;
    console.log('📋 فلترة الموظفين الجدد فقط:', effectiveNewHireOnly);
    
    let excludedByNewHireCount = 0;
    let newHireCount = 0;
    let notNewHireCount = 0;
    let totalFilteredCount = 0;
    
    const requiredEmployees = employees.filter(emp => {
        const empDept = String(emp.department || '').trim().toLowerCase();
        const empLevel = String(emp.level || '').trim().toLowerCase();
        const empIdStr = String(emp.id).trim();

        // ✅ فلترة القسم والفئة
        if (!selectedDepts.includes(empDept)) return false;
        if (!selectedLevels.includes(empLevel)) return false;
        
        totalFilteredCount++;
        
        // ✅ فلترة الموظفين الجدد فقط (لما يكون كورس New Hire أو المستخدم يختار)
        if (effectiveNewHireOnly) {
            const isNew = isNewHire(emp);
            if (!isNew) {
                notNewHireCount++;
                return false;
            }
            newHireCount++;
        }
        
        // ✅ استبعاد اللي حضروا New Hire Induction (للكورسات التانية فقط)
        if (excludeNewHire && !isNewHireCourse) {
            if (hasAttendedNewHireInduction(empIdStr)) {
                excludedByNewHireCount++;
                return false;
            }
        }

        // ✅ فحص حضور الكورس المطلوب
        const hasAttended = employeeAttendance.get(empIdStr) === true;
        const score = employeeScores.get(empIdStr);
        
        if (!hasAttended) return true;
        if (examRequired && (score === undefined || score < minScore)) return true;
        return false;
    });
    
    console.log('📊 إجمالي الموظفين بعد فلترة القسم والفئة:', totalFilteredCount);
    console.log('📊 الموظفين الجدد:', newHireCount);
    console.log('📊 الموظفين القدامى (تم استبعادهم):', notNewHireCount);
    if (excludeNewHire) console.log('📊 تم استبعادهم (حضروا New Hire):', excludedByNewHireCount);
    console.log('📊 إجمالي الموظفين المطلوبين:', requiredEmployees.length);
    
    displayResults(requiredEmployees, course, minScore, employeeScores, employeeAttendance, examRequired);
}

        // ========== عرض النتائج ==========
        function displayResults(employeesList, course, minScore, employeeScores, employeeAttendance, examRequired) {
            const resultsDiv = document.getElementById('resultsCard');
            const tbody = document.getElementById('resultsTableBody');
            const requiredCountSpan = document.getElementById('requiredCount');
            const selectedCountSpan = document.getElementById('selectedCount');
            
            if (!resultsDiv || !tbody) {
                setTimeout(function() {
                    displayResults(employeesList, course, minScore, employeeScores, employeeAttendance, examRequired);
                }, 100);
                return;
            }
            
            if (requiredCountSpan) {
                requiredCountSpan.textContent = employeesList.length;
            }

            if (employeesList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;">🎉 جميع الموظفين في الأقسام والفئات المحددة أكملوا هذا التدريب بنجاح</td></tr>';
                resultsDiv.style.display = 'block';
                return;
            }
            
            var html = '';
            for (var i = 0; i < employeesList.length; i++) {
                var emp = employeesList[i];
                var empIdStr = String(emp.id).trim();
                var hasAttended = employeeAttendance.get(empIdStr) === true;
                var score = employeeScores.get(empIdStr);
                var hireDateFormatted = formatHireDate(emp.hireDate);
                
                var statusBadge = '';
                if (!hasAttended) {
                    statusBadge = '<span class="status-badge-not-attended">❌ لم يحضر</span>';
                } else if (hasAttended && examRequired && (score === undefined || score < minScore)) {
                    statusBadge = '<span class="status-badge-failed">⚠️ رسب (' + (score || 'لا توجد درجة') + ' < ' + minScore + ')</span>';
                } else {
                    statusBadge = '<span class="status-badge-passed">✅ ناجح</span>';
                }
                
                var scoreBadge = '<span style="color:#a0aec0;">-</span>';
                if (score !== undefined) {
                    if (examRequired && score < minScore) {
                        scoreBadge = '<span style="background:#fed7d7; color:#c53030; padding:4px 12px; border-radius:20px; font-weight:bold;">' + score + '</span>';
                    } else {
                        scoreBadge = '<span style="background:#c6f6d5; color:#22543d; padding:4px 12px; border-radius:20px; font-weight:bold;">' + score + '</span>';
                    }
                }
                
                html += '<tr>';
                html += '<td class="checkbox-col"><input type="checkbox" class="employee-select" data-id="' + emp.id + '" data-name="' + emp.fullName + '" data-dept="' + (emp.department || '-') + '" data-position="' + (emp.position || '-') + '" data-level="' + (emp.level || '-') + '" data-score="' + (score !== undefined ? score : '') + '"></td>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td>' + emp.id + '</td>';
                html += '<td style="text-align:right; font-weight:500;">' + emp.fullName + '</td>';
                html += '<td>' + (emp.department || '-') + '</td>';
                html += '<td>' + (emp.position || '-') + '</td>';
                html += '<td><span style="background:#e2e8f0; padding:4px 8px; border-radius:4px;">' + (emp.level || '-') + '</span></td>';
                html += '<td>' + hireDateFormatted + '</td>';
                html += '<td>' + scoreBadge + '</td>';
                html += '<td>' + statusBadge + '</td>';
                html += '</tr>';
            }
            
            tbody.innerHTML = html;
            
            var selectAllCheckbox = document.getElementById('selectAllCheckbox');
            if (selectAllCheckbox) selectAllCheckbox.checked = false;
            
            if (selectedCountSpan) {
                selectedCountSpan.textContent = '0 / ' + employeesList.length;
            }
            resultsDiv.style.display = 'block';
            
            var checkboxes = document.querySelectorAll('.employee-select');
            for (var j = 0; j < checkboxes.length; j++) {
                checkboxes[j].removeEventListener('change', updateSelectedCount);
                checkboxes[j].addEventListener('change', updateSelectedCount);
            }
        }

        function updateSelectedCount() {
            var total = document.querySelectorAll('.employee-select').length;
            var selected = document.querySelectorAll('.employee-select:checked').length;
            var selectedCountSpan = document.getElementById('selectedCount');
            if (selectedCountSpan) {
                selectedCountSpan.textContent = selected + ' / ' + total;
            }
        }

        function toggleSelectAll() {
            var selectAll = document.getElementById('selectAllCheckbox');
            if (!selectAll) return;
            var checkboxes = document.querySelectorAll('.employee-select');
            for (var i = 0; i < checkboxes.length; i++) {
                checkboxes[i].checked = selectAll.checked;
            }
            updateSelectedCount();
        }

        // ========== تنسيق التاريخ ==========
        function formatHireDate(dateValue) {
            if (!dateValue) return '-';
            
            if (typeof dateValue === 'number') {
                var utcDays = dateValue - 25569;
                var date = new Date(utcDays * 86400000);
                return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
            }
            
            return dateValue.toString().split('T')[0];
        }

        // ========== تغيير السنة ==========
        function changeYear() {
            currentYear = parseInt(document.getElementById('yearSelect').value);
            // تحديث عدد الموظفين الجدد
            const newHiresCount = employees.filter(e => isNewHire(e)).length;
            document.getElementById('newHireCount').textContent = newHiresCount;
            console.log('📅 تم تغيير السنة إلى: ' + currentYear + ' (الموظفين الجدد: ' + newHiresCount + ')');
        }

        // ========== تصدير إلى Excel ==========
        function exportToExcel() {
            var selectedRows = document.querySelectorAll('.employee-select:checked');
            
            if (selectedRows.length === 0) {
                alert('❌ الرجاء اختيار موظفين لتصدير البيانات');
                return;
            }
            
            var exportData = [];
            for (var i = 0; i < selectedRows.length; i++) {
                var row = selectedRows[i];
                exportData.push({
                    'Employee ID': row.dataset.id,
                    'Full Name': row.dataset.name,
                    'Dep': row.dataset.dept,
                    'Position': row.dataset.position,
                    'Level': row.dataset.level,
                    'Previous Score': row.dataset.score || '-',
                    'New Exam Score': ''
                });
            }
            
            var ws = XLSX.utils.json_to_sheet(exportData);
            var wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Required Employees');
            XLSX.writeFile(wb, 'Required_Employees_' + new Date().toISOString().slice(0,10) + '.xlsx');
            showToast('✅ تم تصدير ' + exportData.length + ' موظف بنجاح');
        }

        // ========== دوال تحويل التاريخ (Excel Serial Number) ==========
        function formatDate(dateValue) {
            if (!dateValue) return '-';
            
            if (typeof dateValue === 'number') {
                var utcDays = dateValue - 25569;
                var date = new Date(utcDays * 86400000);
                var year = date.getFullYear();
                var month = String(date.getMonth() + 1).padStart(2, '0');
                var day = String(date.getDate()).padStart(2, '0');
                return year + '-' + month + '-' + day;
            }
            
            var dateStr = dateValue.toString();
            if (dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) return dateStr;
            return dateStr.split('T')[0];
        }

        function getDateObject(dateValue) {
            if (!dateValue) return null;
            
            if (typeof dateValue === 'number') {
                var utcDays = dateValue - 25569;
                return new Date(utcDays * 86400000);
            }
            
            var dateStr = dateValue.toString();
            if (dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
                return new Date(dateStr);
            }
            return new Date(dateStr);
        }

function filterSessionsByMonth() {

        // ========== حساب إحصائيات الأقسام ==========
        function calculateDepartmentStats(filteredSessions) {
            const deptStats = new Map();
            
            filteredSessions.forEach(session => {
                const sessionCode = session.session_code;
                const sessionEnrollments = enrollments.filter(e => e.session_code === sessionCode && e.enrollment_status === 'Completed');
                const course = getCourseByCode(session.course_code);
                const sessionHours = course?.duration_hours || 0;
                
                sessionEnrollments.forEach(enrollment => {
                    const empId = enrollment.employee_id;
                    let dept = employeeDeptMap.get(empId);
                    
                    if (!dept) {
                        const employee = getEmployeeById(empId);
                        if (employee && employee.department) {
                            dept = employee.department;
                            employeeDeptMap.set(empId, dept);
                        }
                    }
                    
                    if (!dept) dept = 'غير محدد';
                    
                    if (!deptStats.has(dept)) {
                        deptStats.set(dept, { 
                            sessions: new Set(),
                            uniqueEmployees: new Set(),
                            hours: 0
                        });
                    }
                    const stats = deptStats.get(dept);
                    stats.uniqueEmployees.add(empId);
                    stats.sessions.add(sessionCode);
                    stats.hours += sessionHours;
                });
            });
            
            const result = Array.from(deptStats.keys()).map(dept => ({
                department: dept,
                sessions: deptStats.get(dept).sessions.size,
                uniqueEmployees: deptStats.get(dept).uniqueEmployees.size,
                hours: parseFloat(deptStats.get(dept).hours.toFixed(1))
            }));
            
            return result.sort((a, b) => b.uniqueEmployees - a.uniqueEmployees);
        }

        // ========== حساب إحصائيات الكورسات ==========
        function calculateCoursesStats(filteredSessions) {
            const courseStats = new Map();
            
            filteredSessions.forEach(session => {
                const course = getCourseByCode(session.course_code);
                const courseName = course ? course.course_name : 'غير محدد';
                const sessionHours = course?.duration_hours || 0;
                
                const sessionEnrollments = enrollments.filter(e => e.session_code === session.session_code && e.enrollment_status === 'Completed');
                const uniqueEmployees = new Set(sessionEnrollments.map(e => e.employee_id));
                
                if (!courseStats.has(courseName)) {
                    courseStats.set(courseName, { 
                        sessions: 0, 
                        uniqueEmployees: new Set(),
                        hours: 0 
                    });
                }
                const stats = courseStats.get(courseName);
                stats.sessions++;
                uniqueEmployees.forEach(empId => stats.uniqueEmployees.add(empId));
                stats.hours += sessionHours * uniqueEmployees.size;
            });
            
            const result = Array.from(courseStats.keys()).map(courseName => ({
                courseName: courseName,
                sessions: courseStats.get(courseName).sessions,
                uniqueAttendees: courseStats.get(courseName).uniqueEmployees.size,
                hours: parseFloat(courseStats.get(courseName).hours.toFixed(1))
            }));
            
            return result.sort((a, b) => b.uniqueAttendees - a.uniqueAttendees);
        }

                const course = getCourseByCode(session.course_code);
                const sessionHours = course?.duration_hours || 0;
                const attendanceCount = enrollments.filter(e => e.session_code === session.session_code && e.enrollment_status === 'Completed').length;
                totalHours += sessionHours * attendanceCount;
                if (attendanceCount > 0 && course) executedCourses.add(course.course_name);
            });
            const hoursPerEmployee = uniqueEmployees.size > 0 ? (totalHours / uniqueEmployees.size).toFixed(1) : 0;
            return {
                totalCoursesAll: courses.length,
                totalCoursesExecuted: executedCourses.size,
                totalSessions: filteredSessions.length,
                totalEnrollments: filteredEnrollments.length,
                completedEnrollments: completedEnrollments.length,
                uniqueEmployees: uniqueEmployees.size,
                totalHours: parseFloat(totalHours.toFixed(1)),
                hoursPerEmployee: hoursPerEmployee,
                completionRate: filteredEnrollments.length > 0 ? (completedEnrollments.length / filteredEnrollments.length * 100).toFixed(1) : 0
            };
        }

        function getEmployeesDetails(filteredSessions) {
            const employeesMap = new Map();
            
            filteredSessions.forEach(session => {
                const sessionCode = session.session_code;
                const sessionEnrollments = enrollments.filter(e => e.session_code === sessionCode && e.enrollment_status === 'Completed');
                const course = getCourseByCode(session.course_code);
                const sessionHours = course?.duration_hours || 0;
                
                sessionEnrollments.forEach(enrollment => {
                    const empId = enrollment.employee_id;
                    const empData = getEmployeeById(empId);
                    if (!empData) return;
                    
                    if (!employeesMap.has(empId)) {
                        employeesMap.set(empId, {
                            id: empId,
                            name: empData.fullName || 'غير معروف',
                            department: empData.department || 'غير محدد',
                            position: empData.position || '-',
                            sessions: [],
                            totalHours: 0,
                            totalCourses: new Set()
                        });
                    }
                    const emp = employeesMap.get(empId);
                    emp.sessions.push({
                        session_date: formatDate(session.session_date),
                        course_name: course?.course_name || 'غير محدد',
                        category: course?.category || '-',
                        hours: sessionHours,
                        trainer: session.trainer_name || '-',
                        score: enrollment.score || 'N/A'
                    });
                    emp.totalHours += sessionHours;
                    emp.totalCourses.add(course?.course_name);
                });
            });
            
            const result = Array.from(employeesMap.values()).map(emp => ({
                ...emp,
                totalCourses: emp.totalCourses.size,
                totalHours: parseFloat(emp.totalHours.toFixed(1)),
                sessions: emp.sessions.sort((a, b) => new Date(b.session_date) - new Date(a.session_date))
            }));
            return result.sort((a, b) => b.totalHours - a.totalHours);
        }

        function renderEmployeesTable(employeesDetails, selectedDept) {
            let filteredEmployees = employeesDetails;
            if (selectedDept !== 'all') filteredEmployees = employeesDetails.filter(emp => emp.department === selectedDept);
            if (filteredEmployees.length === 0) return '<div style="text-align:center; padding:2rem;">📭 لا يوجد موظفين مشاركين</div>';
            return `
                <div class="table-wrapper">
                    <table style="width:100%; min-width:800px;">
                        <thead>
                            <tr style="background:#1e3a5f; color:white;">
                                <th>#</th><th>كود الموظف</th><th>الاسم</th>
                                <th>القسم</th><th>الوظيفة</th><th>الكورسات</th>
                                <th>الجلسات</th><th>الساعات</th><th>التفاصيل</th>
                            <tr>
                        </thead>
                        <tbody>
                            ${filteredEmployees.map((emp, index) => `
                                <tr>
                                    <td>${index+1}</td>
                                    <td>${emp.id}</td>
                                    <td><strong>${emp.name}</strong></td>
                                    <td><span style="background:#e2e8f0; padding:0.2rem 0.6rem; border-radius:1rem;">${emp.department}</span></td>
                                    <td>${emp.position}</td>
                                    <td>${emp.totalCourses} كورس</span></td>
                                    <td>${emp.sessions.length} جلسة</span></td>
                                    <td><span style="font-weight:bold; color:#2b7a4b;">${emp.totalHours}</span> ساعة</span></td>
                                    <td><button class="btn-details" onclick="showEmployeeDetails('${emp.id}')">📋 عرض</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderDepartmentFilter(employeesDetails) {
            const departments = [...new Set(employeesDetails.map(emp => emp.department))].sort();
            return `<div class="filter-group"><label>🏢 القسم:</label><select id="employeeDeptFilter" class="dept-select" onchange="filterEmployeesTable()"><option value="all">كل الأقسام</option>${departments.map(d => `<option value="${d}">${d}</option>`).join('')}</select></div>`;
        }

        function filterEmployeesTable() {
            const dept = document.getElementById('employeeDeptFilter').value;
            const container = document.getElementById('employeesTableContainer');
            if (container) container.innerHTML = renderEmployeesTable(window.currentEmployeesDetails, dept);
        }

        function showEmployeeDetails(employeeId) {
            const employeesDetails = window.currentEmployeesDetails;
            const emp = employeesDetails.find(e => e.id == employeeId);
            if (!emp) return;
            const sortedSessions = [...emp.sessions].sort((a, b) => new Date(b.session_date) - new Date(a.session_date));
            const modal = document.createElement('div');
            modal.style.cssText = `position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:1000;`;
            modal.innerHTML = `<div style="background:white; border-radius:1.5rem; width:90%; max-width:800px; max-height:80vh; overflow-y:auto; padding:1.5rem;">
                <div style="display:flex; justify-content:space-between;"><h3>📋 سجل تدريبات الموظف (On Job)</h3><button onclick="this.closest('div').parentElement.remove()" style="background:#e53e3e; color:white; border:none; padding:0.3rem 1rem; border-radius:1rem;">✖</button></div>
                <div style="background:linear-gradient(135deg, #1e3a5f, #2b7a4b); color:white; padding:1rem; border-radius:1rem; margin:1rem 0;">
                    <div><strong>👤 الاسم:</strong> ${emp.name}</div>
                    <div><strong>🆔 كود الموظف:</strong> ${emp.id}</div>
                    <div><strong>🏢 القسم:</strong> ${emp.department}</div>
                    <div><strong>📚 عدد الكورسات:</strong> ${emp.totalCourses}</div>
                    <div><strong>🎯 عدد الجلسات:</strong> ${emp.sessions.length}</div>
                    <div><strong>⏰ إجمالي الساعات:</strong> ${emp.totalHours} ساعة</div>
                </div>
                <table style="width:100%; border-collapse:collapse;"><thead><tr style="background:#f7fafc;"><th>#</th><th>التاريخ</th><th>الكورس</th><th>المدرب</th><th>الساعات</th><th>الدرجة</th></tr></thead><tbody>
                    ${sortedSessions.map((s, i) => `<tr><td style="width:40px;">${i+1}</td><td style="text-align:center;">${s.session_date||'-'}</td><td style="text-align:center;">${s.course_name}</td><td style="text-align:center;">${s.trainer||'-'}</td><td style="text-align:center;">${s.hours} ساعة</span></td><td style="text-align:center;"><span style="background:#c6f6d5; padding:0.2rem 0.5rem; border-radius:1rem;">${s.score||'N/A'}</span></td></tr>`).join('')}
                </tbody>}</div>`;
            document.body.appendChild(modal);
            modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        }

        function renderDepartmentStats(deptStats) {
            if (deptStats.length === 0) return '<div style="text-align:center; padding:2rem;">لا توجد بيانات</div>';
            return `<div class="dept-stats-grid">${deptStats.map((dept, index) => `<div class="dept-card"><div class="dept-rank">#${index+1}</div><div class="dept-info"><div class="dept-name">🏢 ${dept.department}</div><div class="dept-stats">📚 ${dept.sessions} جلسة | 👥 ${dept.uniqueEmployees} موظف | ⏰ ${dept.hours} ساعة</div></div></div>`).join('')}</div>`;
        }

        function renderCoursesTable(coursesStats) {
            if (coursesStats.length === 0) return '<div style="text-align:center; padding:2rem;">📭 لا توجد تدريبات منفذة في هذا الشهر</div>';
            return `<div class="table-wrapper"><table><thead><tr style="background:#1e3a5f; color:white;"><th>#</th><th>اسم الكورس</th><th>عدد الجلسات</th><th>عدد الحضور</th><th>إجمالي الساعات</th></tr></thead><tbody>
                ${coursesStats.map((course, index) => `<tr><td style="padding: 12px; text-align: center; font-weight: bold;">${index + 1}</td><td style="padding: 12px; text-align: center; font-weight: 500;">${course.courseName}</td><td style="padding: 12px; text-align: center;"><span class="badge-sessions">${course.sessions} جلسة</span></td><td style="padding: 12px; text-align: center;"><span class="badge-attendees">${course.uniqueAttendees} موظف</span></td><td style="padding: 12px; text-align: center;"><span class="badge-hours">${course.hours} ساعة</span></td></tr>`).join('')}
            </tbody></td></div>`;
        }

        function renderStats(stats) {
            return `<div class="stats-grid">
                <div class="stat-card"><div class="stat-value">${stats.totalCoursesAll}</div><div class="stat-label">📚 إجمالي الكورسات</div></div>
                <div class="stat-card"><div class="stat-value">${stats.totalCoursesExecuted}</div><div class="stat-label">✅ الكورسات المنفذة</div></div>
                <div class="stat-card"><div class="stat-value">${stats.totalSessions}</div><div class="stat-label">🎯 إجمالي الجلسات</div></div>
                <div class="stat-card"><div class="stat-value">${stats.uniqueEmployees}</div><div class="stat-label">👥 عدد الموظفين</div></div>
                <div class="stat-card"><div class="stat-value">${stats.totalHours}</div><div class="stat-label">⏰ إجمالي الساعات</div></div>
                <div class="stat-card"><div class="stat-value">${stats.hoursPerEmployee}</div><div class="stat-label">📊 الساعات لكل موظف</div></div>
                <div class="stat-card"><div class="stat-value">${stats.completionRate}%</div><div class="stat-label">✅ نسبة الإكمال</div></div>
            </div>`;
        }

        function renderCharts(deptStats) {
            const hoursSorted = [...deptStats].sort((a, b) => b.hours - a.hours);
            const deptNamesHours = hoursSorted.map(d => d.department);
            const deptHours = hoursSorted.map(d => d.hours);
            const employeesSorted = [...deptStats].sort((a, b) => b.uniqueEmployees - a.uniqueEmployees);
            const deptNamesEmployees = employeesSorted.map(d => d.department);
            const deptUniqueEmployees = employeesSorted.map(d => d.uniqueEmployees);
            
            setTimeout(() => {
                const deptEmployeesCtx = document.getElementById('deptEmployeesChart')?.getContext('2d');
                if (deptEmployeesCtx) {
                    new Chart(deptEmployeesCtx, {
                        type: 'bar',
                        data: { labels: deptNamesEmployees, datasets: [{ label: 'عدد الموظفين', data: deptUniqueEmployees, backgroundColor: '#4299e1' }] }
                    });
                }
                
                const deptHoursCtx = document.getElementById('deptHoursChart')?.getContext('2d');
                if (deptHoursCtx) {
                    new Chart(deptHoursCtx, {
                        type: 'bar',
                        data: { labels: deptNamesHours, datasets: [{ label: 'عدد الساعات', data: deptHours, backgroundColor: '#2b7a4b' }] }
                    });
                }
            }, 100);
            
            return `<div class="charts-row">
                <div class="chart-card"><h3>📊 عدد الموظفين المشاركين</h3><canvas id="deptEmployeesChart"></canvas></div>
                <div class="chart-card"><h3>⏰ إجمالي ساعات التدريب</h3><canvas id="deptHoursChart"></canvas></div>
            </div>`;
        }

function changeMonth() { 
    currentMonth = parseInt(document.getElementById('monthSelect').value); 
    loadPage(); 
}

// ✅ دالة تغيير السنة - أضفها هنا
function changeYear() {
    currentYear = parseInt(document.getElementById('yearSelect').value);
    loadPage();
}

        function logout() { 
            // مسح الكاش عند تسجيل الخروج
            if (window.CacheManager) {
                for (const key in CACHE_KEYS) {
                    CacheManager.remove(CACHE_KEYS[key]);
                    localStorage.removeItem(CACHE_KEYS[key] + '_time');
                }
            }
            auth.signOut().then(() => {
                sessionStorage.removeItem('loggedUser'); 
                window.location.href = 'login.html';
            });
        }

async function loadPage(forceRefresh) {
    await Promise.all([
        loadEmployeesData(forceRefresh),
        loadCourses(forceRefresh),
        loadSessions(forceRefresh),
        loadEnrollments(forceRefresh)
    ]);
    
    let filteredSessions = filterSessionsByMonth();
    
    const stats = calculateStats(filteredSessions);
    const deptStats = calculateDepartmentStats(filteredSessions);
    const coursesStats = calculateCoursesStats(filteredSessions);
    const employeesDetails = getEmployeesDetails(filteredSessions);
    
    window.currentEmployeesDetails = employeesDetails;
    const monthName = currentMonth === -1 ? "كل الشهور" : monthNames[currentMonth];
    
    // ✅ توليد قائمة السنوات تلقائياً
    const currentFullYear = new Date().getFullYear();
    const startYear = 2025;
    let yearOptionsHTML = '';
    for (let y = startYear; y <= currentFullYear + 1; y++) {
        yearOptionsHTML += `<option value="${y}" ${currentYear === y ? 'selected' : ''}>${y}</option>`;
    }
    
    document.getElementById('app').innerHTML = `
        <div class="navbar">
            <div class="logo"><h2>🎓 <span>نظام</span> إدارة التعليم والتطوير</h2></div>
            <div class="nav-links">
                <a href="index.html" class="home">🏠 الرئيسية</a>
                <a href="#" onclick="logout()" class="logout">🚪 تسجيل خروج</a>
            </div>
        </div>
        <div class="container">
            <div class="page-header"><h1>📊 تقارير التدريب (On Job)</h1><p>تحليل شامل للتدريبات الداخلية - ${monthName} ${currentYear}</p></div>
            <div class="filter-bar">
                <div class="filter-group">
                    <label>📅 السنة:</label>
                    <select id="yearSelect" class="month-select" onchange="changeYear()">
                        ${yearOptionsHTML}
                    </select>
                </div>
                <div class="filter-group">
                    <label>📅 الشهر:</label>
                    <select id="monthSelect" class="month-select" onchange="changeMonth()">
                        <option value="-1" ${currentMonth === -1 ? 'selected' : ''}>كل الشهور</option>
                        ${monthNames.map((m, i) => `<option value="${i}" ${currentMonth === i ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                </div>
                <div class="filter-group"><span>📊 عرض بيانات ${monthName} ${currentYear}</span></div>
                <div class="filter-group"><button class="refresh-btn" onclick="refreshAllData()">🔄 تحديث البيانات</button></div>
            </div>
            ${renderStats(stats)}
            <div class="data-table-card"><h3>🏆 أكثر الأقسام مشاركة</h3><div id="deptStatsContainer">${renderDepartmentStats(deptStats)}</div></div>
            ${renderCharts(deptStats)}
            <div class="data-table-card"><h3>👥 الموظفين المشاركين (${monthName} ${currentYear})</h3>${renderDepartmentFilter(employeesDetails)}<div id="employeesTableContainer" style="margin-top:1rem;">${renderEmployeesTable(employeesDetails, 'all')}</div></div>
            <div class="data-table-card"><h3>📚 التدريبات المنفذة خلال ${monthName} ${currentYear}</h3><div id="coursesTableContainer">${renderCoursesTable(coursesStats)}</div></div>
        </div>
        <div class="footer"><p>© 2025 نظام إدارة التعليم والتطوير</p></div>
    `;
    
    updateCacheInfo();
    window.filterEmployeesTable = filterEmployeesTable;
    window.showEmployeeDetails = showEmployeeDetails;
}

        // ========== بدء التشغيل ==========
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                console.log("✅ مستخدم مسجل دخول:", user.email);
                await loadPage(false);
                window.changeMonth = changeMonth;
                        window.changeYear = changeYear;   // ✅ أضف هذا السطر
                window.logout = logout;
            } else {
                const loggedUser = JSON.parse(sessionStorage.getItem('loggedUser'));
                if (loggedUser) {
                    await loadPage(false);
                } else {
                    window.location.href = 'login.html';
                }
            }
        });
    </script>
